  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--sand);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; letter-spacing:.01em;}

  #app{display:flex; flex-direction:column; height:100vh; height:100dvh;}

  /* ---------- Header ---------- */
  header{
    background:var(--navy);
    color:#fff;
    padding:14px 18px 10px 18px;
    flex-shrink:0;
  }
  .header-row{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand svg{flex-shrink:0;}
  .brand-logo{height:32px; width:auto; flex-shrink:0; border-radius:6px; display:block;}
  .brand-text h1{font-size:15px; margin:0; font-weight:700; letter-spacing:.02em;}
  .brand-text span{font-size:12px; color:var(--header-muted);}
  .header-actions{display:flex; gap:8px; flex-wrap:wrap;}
  .btn{
    border:none; border-radius:8px; padding:9px 14px; font-size:13px; font-weight:600;
    cursor:pointer; display:inline-flex; align-items:center; gap:6px; transition:filter .15s, transform .05s;
    font-family:inherit;
  }
  .btn:active{transform:translateY(1px);}
  .btn-ghost{background:rgba(255,255,255,.1); color:#fff;}
  .btn-ghost:hover{background:rgba(255,255,255,.18);}
  .btn-sea{background:var(--sea); color:#fff;}
  .btn-sea:hover{filter:brightness(1.08);}
  .btn-coral{background:var(--coral); color:#fff;}
  .btn-coral:hover{filter:brightness(1.08);}
  .btn-outline{background:transparent; border:1px solid var(--line); color:var(--ink);}
  .btn-outline:hover{background:#eaeee9;}

  .status-line{font-size:12px; color:var(--header-muted); margin-top:6px;}

  /* ---------- Tabs ---------- */
  .body-row{display:flex; flex-direction:row; flex:1; min-height:0;}
  .tabbar-wrap{
    background:var(--navy-2);
    overflow-x:auto;

  .tabbar-wrap.vertical{

  .tab{

  /* ---------- Content ---------- */
  main{flex:1; overflow-y:auto; padding:16px;}

  .boat-list{display:flex; flex-direction:column; gap:8px;}

    display:flex; align-items:center; gap:12px;
  }
  .boat-card.visto{background:var(--entrada-bg); border-color:var(--entrada-border);}

  .boat-visto{
    flex-shrink:0; width:24px; height:24px; border-radius:7px; border:2px solid var(--ok);
    display:flex; align-items:center; justify-content:center; cursor:pointer; background:#fff;
  }
  .boat-visto.on{background:var(--ok);}
  .boat-visto svg{display:none; width:14px; height:14px; stroke:#fff;}
  .boat-visto.on svg{display:block;}
  .boat-check{
    flex-shrink:0; width:26px; height:26px; border-radius:7px; border:2px solid var(--sea);
    display:flex; align-items:center; justify-content:center; cursor:pointer; background:#fff;
  }
  .boat-check.on{background:var(--exit);}
  .boat-check svg{display:none; width:16px; height:16px; stroke:#fff;}
  .boat-check.on svg{display:block;}
  .boat-info{flex:1; min-width:0;}
  .boat-name{font-weight:700; font-size:14px; color:var(--ink);}
  .boat-name .matricula{font-weight:700; color:var(--sea-dark); margin-left:8px;}
  .boat-meta{font-size:12px; color:var(--muted); margin-top:2px;}
  .boat-meta .amarre{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; color:var(--sea-dark); font-weight:700; margin-right:8px;}
  .boat-salida{display:flex; align-items:center; gap:8px; flex-shrink:0; cursor:pointer; padding-left:8px;}
  .boat-salida-label{font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.04em;}
  .boat-card.checked .boat-salida-label{color:var(--exit);}
  .obs-toggle{
    font-size:11px; color:var(--sea-dark); background:none; border:none; cursor:pointer; padding:4px 0;
    text-decoration:underline;
  }
  .obs-input{
    margin-top:6px; width:100%; font-size:12px; padding:6px 8px; border:1px solid var(--line);
    border-radius:6px; font-family:inherit;
  }

  .extra-list{margin-top:18px;}
  .extra-title{font-size:13px; font-weight:700; color:var(--navy); margin-bottom:8px;}
  .boat-card.entrada{background:var(--entrada-bg); border-color:var(--entrada-border);}
  .remove-btn{
    background:none; border:none; color:var(--coral); cursor:pointer; font-size:18px; line-height:1; padding:4px 8px; flex-shrink:0;
  }

  .empty-state{color:var(--muted); font-size:13px; padding:30px 10px; text-align:center;}

  /* ---------- Floating add button ---------- */
  .fab-row{position:sticky; bottom:0; display:flex; justify-content:flex-end; padding-top:12px;}

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(36,34,84,.55); display:flex; align-items:center; justify-content:center;
    padding:16px; z-index:50;
  }
  .modal{
    background:#fff; border-radius:12px; padding:20px; width:100%; max-width:420px; max-height:90vh; overflow-y:auto;
  }
  .modal h3{margin:0 0 14px 0; font-size:16px; color:var(--navy);}
  .field{margin-bottom:10px;}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:4px; font-weight:600;}
  .field input, .field select, .field textarea{
    width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:7px; font-size:14px; font-family:inherit;
  }
  .field textarea{resize:vertical; min-height:84px;}
  .atraque-input{display:flex; align-items:stretch; border:1px solid var(--line); border-radius:7px; overflow:hidden;}
  .atraque-input .atraque-prefix{
    background:#f0ede3; color:var(--muted); font-weight:700; padding:0 10px; display:flex; align-items:center;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  .atraque-input input{border:none; border-radius:0; flex:1; padding:9px 10px; font-size:14px; font-family:inherit;}
  .modal-actions{display:flex; gap:8px; justify-content:flex-end; margin-top:16px;}

  /* ---------- Previsualización de impresión ---------- */
  .print-preview{
    background:#fff; border-radius:12px; width:100%; max-width:720px; max-height:92vh;
    display:flex; flex-direction:column; overflow:hidden; box-shadow:0 10px 40px rgba(0,0,0,.3);
  }
  .print-preview-toolbar{
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    padding:14px 18px; border-bottom:1px solid var(--line); flex-shrink:0;
  }
  .print-preview-toolbar h3{margin:0; font-size:15px; color:var(--navy);}
  .print-preview-actions{display:flex; gap:8px;}
  .print-preview-scroll{flex:1; overflow-y:auto; background:#d9d9d9; padding:20px;}
  .print-preview-paper{
    background:#fff; max-width:600px; margin:0 auto; padding:24px;
    box-shadow:0 2px 10px rgba(0,0,0,.18); border-radius:2px;
  }

  /* ---------- Upload screen ---------- */
  .upload-screen{
    flex:1; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .upload-box{
    background:#fff; border:2px dashed var(--line); border-radius:14px; padding:0 28px 36px 28px; text-align:center; max-width:420px; overflow:hidden;
  }
  .upload-banner{
    height:16px; margin:0 -28px 24px -28px;
    background-image:var(--logo-tile-uri); background-repeat:repeat-x; background-position:left top; background-size:auto 16px;
  }
  .upload-logo{height:56px; width:auto; display:block; margin:0 auto 14px auto; border-radius:8px;}
  .upload-box h2{color:var(--navy); font-size:17px; margin:10px 0 6px 0;}
  .upload-box p{color:var(--muted); font-size:13px; line-height:1.5; margin:0 0 18px 0;}
  input[type="file"]{display:none;}

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--navy); color:#fff; padding:10px 18px; border-radius:30px; font-size:13px; z-index:100;
    box-shadow:0 6px 20px rgba(0,0,0,.25);
  }

  /* ---------- Print ---------- */
  #printArea{display:none;}
  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{display:block; position:absolute; top:0; left:0; width:100%; padding:20px;}
  }
  .p-head{display:flex; justify-content:space-between; align-items:flex-start; border-bottom:3px solid var(--navy); padding-bottom:14px; margin-bottom:16px;}
  .p-logo{display:flex; align-items:center;}
  .p-logo-lockup{height:54px; width:auto; display:block;}
  .p-title{font-size:19px; font-weight:800; color:var(--navy); text-align:right;}
  .p-date{font-size:12px; color:#333; text-align:right; margin-top:6px;}
  .p-section-title{font-size:14px; font-weight:800; color:var(--navy); margin:18px 0 6px 0; text-transform:uppercase; letter-spacing:.04em;}
  table.p-table{width:100%; border-collapse:collapse; font-size:11px;}
  table.p-table th, table.p-table td{border:1px solid var(--navy); padding:5px 7px; text-align:left;}
  table.p-table th{background:#eef2ee; font-weight:700;}
  table.p-table td.empty-row{color:#999; font-style:italic;}

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#242254">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<div id="app"></div>
<div id="printArea"></div>

<script>
(function(){
  "use strict";

  // ---------------- State ----------------
  var state = {
    ready:false,
    boats: [],            // {id, amarre, zona, descripcion, nombre, matricula}
    zoneOrder: [],
    currentZone: null,
    day: { salidas:{}, entradas:[], vistos:{} },
    dateKey: todayKey(),
    uploading:false,
    obsOpen: {},
    tabDragSuppressUntil: 0,
    tabsVertical:false
  };

  function todayKey(){
    var d = new Date();
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  function todayLabel(){
    var d = new Date();
    var meses = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
    return { dia: d.getDate(), mes: meses[d.getMonth()], anio: d.getFullYear() };
  }
  function escapeHtml(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  var ZONE_ORDER_DEFAULT = [
    "Muelle Espera","Motos","P1-P5","Muelle Ribera","Arlequín","Guramí","Obispo","Canal",
    "Marlin","Sierra","Caballito","Nécora","Dragoncillo","Corvo","Vela","Romana",
    "Tortuga","Alboaire","Barbero","Golondrina","Luna","Carey","Guadalmarina",
    "Loro","Barbesula","Emperador","Delfín","Volador","Candil","Arquero",
    "Contradique","Extra"
  ];

  // Prefijo alfabético representativo de cada zona (para el alta manual de
  // entradas: el marinero solo escribe el número, el prefijo se da por hecho).
  // "Extra" no tiene prefijo fijo: el atraque se escribe libremente.
  var ZONE_PREFIX = {
    "Muelle Espera":"ME", "Motos":"MTA", "P1-P5":"A", "Muelle Ribera":"A",
    "Arlequín":"AL", "Guramí":"GU", "Obispo":"OB", "Canal":"CAN",
    "Marlin":"M", "Sierra":"SR", "Caballito":"CB", "Nécora":"NE",
    "Dragoncillo":"DR", "Corvo":"CV", "Vela":"IV", "Romana":"RM",
    "Tortuga":"IT", "Alboaire":"AB", "Barbero":"PB", "Golondrina":"GL",
    "Luna":"PL", "Carey":"IC", "Guadalmarina":"GM", "Loro":"LR",
    "Barbesula":"BB", "Emperador":"EM", "Delfín":"DL", "Volador":"PV",
    "Candil":"CD", "Arquero":"AQ", "Contradique":"A"
  };
  function zonePrefix(zona){ return ZONE_PREFIX[zona] || null; }

  function classifyZone(amarreRaw){
    var amarre = String(amarreRaw||"").trim().toUpperCase();
    var m = /^([A-ZÁÉÍÓÚÑ]+)(\d+)?/.exec(amarre);
    var letters = m ? m[1] : amarre;
    var num = (m && m[2]) ? parseInt(m[2],10) : null;
    function starts(code){ return letters.indexOf(code) === 0; }

    if(starts("ME")) return "Muelle Espera";
    if(starts("MTA")) return "Motos";
    if(starts("ARCO")) return "Contradique";
    if(letters === "A"){
      if(num !== null){
        if(num >= 0 && num <= 378) return "P1-P5";
        if(num >= 379 && num <= 401) return "Muelle Ribera";
        if(num >= 402 && num <= 548) return "Contradique";
      }
      return "Extra";
    }
    if(letters === "M") return "Marlin";
    if(starts("AL")) return "Arlequín";
    if(starts("GU")) return "Guramí";
    if(starts("OB")) return "Obispo";
    if(starts("CAN")) return "Canal";
    if(starts("SR")) return "Sierra";
    if(starts("CB")) return "Caballito";
    if(starts("NE")) return "Nécora";
    if(starts("DR")) return "Dragoncillo";
    if(starts("CV")) return "Corvo";
    if(starts("IV")) return "Vela";
    if(starts("RM")) return "Romana";
    if(starts("IT")) return "Tortuga";
    if(starts("AB")) return "Alboaire";
    if(starts("PB")) return "Barbero";
    if(starts("GL")) return "Golondrina";
    if(starts("PL")) return "Luna";
    if(starts("IC")) return "Carey";
    if(starts("GM")) return "Guadalmarina";
    if(starts("LR") || starts("LJ")) return "Loro";
    if(starts("BB") || starts("BP")) return "Barbesula";
    if(starts("EM")) return "Emperador";
    if(starts("DL")) return "Delfín";
    if(starts("PV")) return "Volador";
    if(starts("CD")) return "Candil";
    if(starts("AQ")) return "Arquero";
    return "Extra";
  }
  function toast(msg){
    var t = document.createElement("div");
    t.className = "toast";
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function(){ t.remove(); }, 2600);
  }

  // ---------------- Storage ----------------
  // Dos capas de guardado, para que nunca se pierda nada:
  //  1) localStorage del propio dispositivo/navegador: siempre disponible,
  //     no depende de conexión ni de la capacidad "db" de Claude, y se
  //     escribe en cada cambio. Es la copia que garantiza que nada se
  //     pierde al cerrar la pestaña, recargar o reiniciar el dispositivo.
  //  2) capacidad "db" de Claude (solo cuando la app se abre publicada como
  //     artefacto): guardado compartido entre varios usuarios/dispositivos
  //     a la vez. Si no está disponible (archivo .html abierto suelto), la
  //     app sigue funcionando igual apoyándose solo en localStorage.
  var dbApi = null;
  var LS_PREFIX = "gestorEmbarcaciones.";
  var LS_MASTER = LS_PREFIX + "master";
  var LS_ORDER = LS_PREFIX + "zoneOrder";
  var LS_DAY_PREFIX = LS_PREFIX + "day.";
  var LS_TABS_VERTICAL = LS_PREFIX + "tabsVertical";

  function lsGet(key){
    try{
      var raw = window.localStorage.getItem(key);
      return raw==null ? null : JSON.parse(raw);
    }catch(e){ return null; }
  }
  function lsSet(key, value){
    try{
      window.localStorage.setItem(key, JSON.stringify(value));
      return true;
    }catch(e){ return false; }
  }

  async function initDb(){
    try{
      if(window.claude && typeof window.claude.use === "function"){
        dbApi = await window.claude.use("db");
      }
    }catch(e){ dbApi = null; }
  }

  async function loadAll(){
    await initDb();

    var masterLoaded = false;
    if(dbApi){
      try{
        var masterSnap = await dbApi.doc("state/master").get();
        if(masterSnap.exists){
          var parsed = masterSnap.data();
          state.boats = parsed.boats || [];
          state.masterUpdatedAt = parsed.updatedAt;
          masterLoaded = true;
        }
      }catch(e){ /* no existe aún */ }

      try{
        var orderSnap = await dbApi.doc("state/zoneOrder").get();
        if(orderSnap.exists){
          var orderData = orderSnap.data();
          if(orderData.order) state.zoneOrder = orderData.order;
        }
      }catch(e){}
    }

    if(!masterLoaded){
      var localMaster = lsGet(LS_MASTER);
      if(localMaster){
        state.boats = localMaster.boats || [];
        state.masterUpdatedAt = localMaster.updatedAt || null;
      }
      if(!state.zoneOrder.length){
        var localOrder = lsGet(LS_ORDER);
        if(localOrder && localOrder.order) state.zoneOrder = localOrder.order;
      }
    }

    if(state.boats.length){
      ensureZoneOrder();
      state.currentZone = state.zoneOrder[0] || null;
    }

    var savedTabsVertical = lsGet(LS_TABS_VERTICAL);
    state.tabsVertical = !!(savedTabsVertical && savedTabsVertical.on);

    await loadDay();
    state.ready = true;
    render();
  }

  async function loadDay(){
    if(dbApi){
      try{
        var snap = await dbApi.doc("days/"+state.dateKey).get();
        if(snap.exists){
          var data = snap.data();
          state.day = { salidas: data.salidas || {}, entradas: data.entradas || [], vistos: data.vistos || {} };
          return;
        }
      }catch(e){ /* sigue abajo y prueba con la copia local */ }
    }
    var local = lsGet(LS_DAY_PREFIX + state.dateKey);
    state.day = local ? { salidas: local.salidas || {}, entradas: local.entradas || [], vistos: local.vistos || {} } : { salidas:{}, entradas:[], vistos:{} };
  }

  async function saveDay(){
    // Copia local siempre, en cada cambio: es la garantía de que nada se
    // pierde aunque falle la conexión o no haya guardado compartido.
    lsSet(LS_DAY_PREFIX + state.dateKey, state.day);
    if(!dbApi) return;
    try{
      await dbApi.doc("days/"+state.dateKey).set(state.day);
    }catch(e){
      toast("No se pudo sincronizar con el guardado compartido; se ha guardado una copia en este dispositivo.");
    }
  }

  async function saveZoneOrder(){
    lsSet(LS_ORDER, {order: state.zoneOrder});
    if(!dbApi) return;
    try{
      await dbApi.doc("state/zoneOrder").set({order: state.zoneOrder});
    }catch(e){
      toast("No se pudo sincronizar el orden de pestañas; se ha guardado en este dispositivo.");
    }
  }

  function ensureZoneOrder(){
    var zonesPresent = Array.from(new Set(state.boats.map(function(b){ return b.zona; })));
    // conserva orden ya guardado, quita zonas que ya no existan
    var order = (state.zoneOrder||[]).filter(function(z){ return zonesPresent.indexOf(z) !== -1; });
    // añade zonas nuevas siguiendo el orden canónico definido; lo que no esté en ese orden, al final alfabéticamente
    var missing = zonesPresent.filter(function(z){ return order.indexOf(z) === -1; }).sort(function(a,b){
      var ia = ZONE_ORDER_DEFAULT.indexOf(a); if(ia===-1) ia = 999;
      var ib = ZONE_ORDER_DEFAULT.indexOf(b); if(ib===-1) ib = 999;
      if(ia !== ib) return ia-ib;
      return a.localeCompare(b,"es");
    });
    state.zoneOrder = order.concat(missing);
  }

  // ---------------- Excel import ----------------
  function handleFile(file){
    if(!file) return;
    state.uploading = true; render();
    var reader = new FileReader();
    reader.onload = async function(e){
      var boats;
      try{
        var data = new Uint8Array(e.target.result);
        var wb = XLSX.read(data, {type:"array"});
        var sheet = wb.Sheets[wb.SheetNames[0]];
        var rows = XLSX.utils.sheet_to_json(sheet, {header:1, defval:""});
        boats = [];
        for(var i=1;i<rows.length;i++){ // salta cabecera
          var r = rows[i];
          var amarre = (r[0]||"").toString().trim();
          if(!amarre) continue;
          var descripcion = (r[1]||"").toString().trim();
          var nombre = (r[2]||"").toString().trim();
          var matricula = (r[3]||"").toString().trim();
          boats.push({
            id: amarre + "__" + i,
            amarre: amarre,
            zona: classifyZone(amarre),
            descripcion: descripcion,
            nombre: nombre || "(sin nombre)",
            matricula: matricula
          });
        }
      }catch(err){
        toast("Error leyendo el Excel. Comprueba el formato.");
        state.uploading = false; render();
        return;
      }

      if(!boats.length){
        toast("No se han encontrado filas válidas en el Excel.");
        state.uploading = false; render();
        return;
      }

      state.boats = boats;
      ensureZoneOrder();
      state.currentZone = state.zoneOrder[0] || null;
      state.masterUpdatedAt = new Date().toISOString();

      // Copia local siempre (garantiza que el listado sigue ahí aunque no
      // haya guardado compartido o falle la conexión).
      lsSet(LS_MASTER, {boats: boats, updatedAt: state.masterUpdatedAt});

      if(dbApi){
        try{
          await dbApi.doc("state/master").set({boats: boats, updatedAt: state.masterUpdatedAt});
          await saveZoneOrder();
          toast("Listado actualizado: " + boats.length + " embarcaciones en " + state.zoneOrder.length + " zonas.");
        }catch(err){
          await saveZoneOrder();
          toast("Listado actualizado: " + boats.length + " embarcaciones en " + state.zoneOrder.length + " zonas (guardado en este dispositivo).");
        }
      } else {
        await saveZoneOrder();
        toast("Listado actualizado: " + boats.length + " embarcaciones en " + state.zoneOrder.length + " zonas (guardado en este dispositivo).");
      }

      state.uploading = false;
      render();
    };
    reader.readAsArrayBuffer(file);
  }

  // ---------------- Acciones ----------------
  function toggleSalida(boatId){
    var cur = state.day.salidas[boatId];
    if(cur && cur.checked){
      delete state.day.salidas[boatId];
    } else {
      state.day.salidas[boatId] = { checked:true, obs: (cur && cur.obs) || "" };
    }
    saveDay();
    render();
  }
  function setObs(boatId, text){
    if(!state.day.salidas[boatId]) state.day.salidas[boatId] = {checked:true, obs:""};
    state.day.salidas[boatId].obs = text;
    saveDay();
  }
  function toggleVisto(boatId){
    if(state.day.vistos[boatId]){
      delete state.day.vistos[boatId];
    } else {
      state.day.vistos[boatId] = true;
    }
    saveDay();
    render();
  }
  function toggleTabsOrientation(){
    state.tabsVertical = !state.tabsVertical;
    lsSet(LS_TABS_VERTICAL, {on: state.tabsVertical});
    render();
  }
  function addEntrada(zona, data){
    state.day.entradas.push({
      id: "e"+Date.now()+Math.random().toString(36).slice(2,6),
      zona: zona,
      embarcacion: data.embarcacion || "(sin nombre)",
      matricula: data.matricula,
      atraque: data.atraque,
      observaciones: data.observaciones
    });
    saveDay();
    render();
  }
  function removeEntrada(id){
    state.day.entradas = state.day.entradas.filter(function(e){ return e.id !== id; });
    saveDay();
    render();
  }

  function buildPrintArea(){
    document.getElementById("printArea").innerHTML = getPrintHtml();
  }

  function openPrintPreview(){
    buildPrintArea();
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.innerHTML =
      '<div class="print-preview">'+
        '<div class="print-preview-toolbar">'+
          '<h3>Previsualización del parte</h3>'+
          '<div class="print-preview-actions">'+
            '<button class="btn btn-outline" id="pp_close">Cerrar</button>'+
            '<button class="btn btn-sea" id="pp_export">Exportar</button>'+
          '</div>'+
        '</div>'+
        '<div class="print-preview-scroll"><div class="print-preview-paper" id="pp_paper">'+getPrintHtml()+'</div></div>'+
      '</div>';
    document.body.appendChild(overlay);
    document.getElementById("pp_close").onclick = function(){ overlay.remove(); };
    document.getElementById("pp_export").onclick = function(){ exportPdf(overlay); };
  }

  function exportPdf(overlay){
    var paper = document.getElementById("pp_paper");
    var exportBtn = document.getElementById("pp_export");
    if(!paper || !window.html2canvas || !window.jspdf){
      toast("No se pudo generar el PDF en este dispositivo.");
      return;
    }
    if(exportBtn){ exportBtn.disabled = true; exportBtn.textContent = "Generando…"; }
    window.html2canvas(paper, { scale:2, backgroundColor:"#ffffff" }).then(function(canvas){
      var jsPDF = window.jspdf.jsPDF;
      var pdf = new jsPDF({ orientation:"portrait", unit:"mm", format:"a4" });
      var pageW = pdf.internal.pageSize.getWidth();
      var pageH = pdf.internal.pageSize.getHeight();
      var margin = 10;
      var imgW = pageW - margin*2;
      var imgH = imgW * canvas.height / canvas.width;
      if(imgH > pageH - margin*2){ imgH = pageH - margin*2; imgW = imgH * canvas.width / canvas.height; }
      var imgData = canvas.toDataURL("image/png");
      pdf.addImage(imgData, "PNG", margin, margin, imgW, imgH);
      var lbl = todayLabel();
      var fname = "parte-embarcaciones-" + lbl.anio + "-" + String(lbl.dia).padStart(2,"0") + "-" + lbl.mes + ".pdf";
      pdf.save(fname);
      if(exportBtn){ exportBtn.disabled = false; exportBtn.textContent = "Exportar"; }
      if(overlay) overlay.remove();
    }).catch(function(){
      toast("Error al generar el PDF.");
      if(exportBtn){ exportBtn.disabled = false; exportBtn.textContent = "Exportar"; }
    });
  }

  function doPrint(){
    openPrintPreview();
  }

  // ---------------- Reordenar pestañas (mantener pulsado y arrastrar) ----------------
  // El drag & drop nativo de HTML5 (draggable="true") no funciona con el dedo
  // en móviles (Android/iOS), solo con ratón. Se sustituye por un gesto de
  // "mantener pulsado" implementado con Pointer Events, que funciona igual
  // con ratón y con el dedo. Mientras se mantiene pulsada una pestaña más de
  // ~350ms sin moverse demasiado, se activa el modo de arrastre: al mover el
  // dedo/ratón por encima de otras pestañas se van intercambiando en vivo, y
  // al soltar se guarda el nuevo orden.
  var tabDrag = null; // {el, startX, startY, timer, active, pointerId}

  function onTabPointerDown(el, ev){
    if(ev.pointerType === "mouse" && ev.button !== 0) return;
    cancelTabDrag();
    var startX = ev.clientX, startY = ev.clientY;
    var timer = setTimeout(function(){
      if(!tabDrag) return;
      tabDrag.active = true;
      el.classList.add("dragging");
      document.addEventListener("pointermove", onTabPointerMove);
      document.addEventListener("pointerup", onTabPointerUp);
      document.addEventListener("pointercancel", onTabPointerUp);
    }, 350);
    tabDrag = { el: el, startX: startX, startY: startY, timer: timer, active: false, pointerId: ev.pointerId };
  }

  function onTabPointerMove(ev){
    if(!tabDrag) return;
    if(!tabDrag.active){
      // Si se mueve demasiado antes de que pase el tiempo de espera, se
      // entiende como un gesto normal (p. ej. desplazar la barra) y se
      // cancela el posible arrastre.
      if(Math.abs(ev.clientX - tabDrag.startX) > 10 || Math.abs(ev.clientY - tabDrag.startY) > 10){
        cancelTabDrag();
      }
      return;
    }
    ev.preventDefault();
    var tabbar = tabDrag.el.parentElement;
    if(!tabbar) return;
    var vertical = tabbar.classList.contains("vertical");
    var tabs = Array.prototype.slice.call(tabbar.querySelectorAll(".tab"));
    var pos = vertical ? ev.clientY : ev.clientX;
    for(var i=0;i<tabs.length;i++){
      if(tabs[i] === tabDrag.el) continue;
      var rect = tabs[i].getBoundingClientRect();
      var mid = vertical ? (rect.top + rect.height/2) : (rect.left + rect.width/2);
      if(pos < mid){
        if(tabs[i] !== tabDrag.el.nextSibling){
          tabbar.insertBefore(tabDrag.el, tabs[i]);
        }
        return;
      }
    }
    // más al final que todas (a la derecha, o abajo si es vertical): va al final
    if(tabbar.lastElementChild !== tabDrag.el){
      tabbar.appendChild(tabDrag.el);
    }
  }

  function onTabPointerUp(){
    if(!tabDrag) return;
    var wasActive = tabDrag.active;
    var tabbar = tabDrag.el.parentElement;
    document.removeEventListener("pointermove", onTabPointerMove);
    document.removeEventListener("pointerup", onTabPointerUp);
    document.removeEventListener("pointercancel", onTabPointerUp);
    clearTimeout(tabDrag.timer);
    if(wasActive && tabbar){
      tabDrag.el.classList.remove("dragging");
      var newOrder = Array.prototype.map.call(tabbar.querySelectorAll(".tab"), function(el){ return el.getAttribute("data-zone"); });
      state.zoneOrder = newOrder;
      // Evita que el "click" fantasma que dispara el navegador al soltar
      // (y solo ese, durante una ventana breve) cambie de zona sin querer.
      state.tabDragSuppressUntil = Date.now() + 400;
      saveZoneOrder();
      render();
    }
    tabDrag = null;
  }

  function cancelTabDrag(){
    if(!tabDrag) return;
    clearTimeout(tabDrag.timer);
    if(tabDrag.active && tabDrag.el) tabDrag.el.classList.remove("dragging");
    document.removeEventListener("pointermove", onTabPointerMove);
    document.removeEventListener("pointerup", onTabPointerUp);
    document.removeEventListener("pointercancel", onTabPointerUp);
    tabDrag = null;
  }

  // ---------------- Modal "añadir entrada" ----------------
  var modalState = null; // { zona }
  function openEntradaModal(zona){ modalState = { zona: zona }; render(); }
  function closeModal(){ modalState = null; render(); }

  // ---------------- Render ----------------
  var root = document.getElementById("app");

  function render(){
    if(!state.ready){
      root.innerHTML = '<div class="upload-screen"><div class="upload-box"><p>Cargando…</p></div></div>';
      return;
    }
    if(!state.boats.length){
      renderUploadScreen();
      return;
    }

    var boatsInZone = state.boats.filter(function(b){ return b.zona === state.currentZone; })
      .sort(function(a,b){ return a.amarre.localeCompare(b.amarre, "es", {numeric:true}); });
    var checkedCount = boatsInZone.filter(function(b){ return state.day.salidas[b.id] && state.day.salidas[b.id].checked; }).length;
    var entradasZona = state.day.entradas.filter(function(e){ return e.zona === state.currentZone; });

    var html = "";
    html += renderHeader();
    if(state.tabsVertical){ html += '<div class="body-row">'; }
    html += renderTabs();
    html += '<main>';
    html += '<div class="zone-header">';
    html += '  <div class="zone-title">Zona '+escapeHtml(state.currentZone)+'</div>';
    html += '  <div class="zone-progress">'+checkedCount+' / '+boatsInZone.length+' con salida marcada</div>';
    html += '</div>';

    if(!boatsInZone.length){
      html += '<div class="empty-state">No hay embarcaciones registradas en esta zona.</div>';
    } else {
      html += '<div class="boat-list">';
      boatsInZone.forEach(function(b){
        var salida = state.day.salidas[b.id];
        var isChecked = !!(salida && salida.checked);
        var isVisto = !!state.day.vistos[b.id];
        var obsOpen = !!state.obsOpen[b.id];
        var cardClass = (isVisto?"visto ":"")+(isChecked?"checked":"");
        html += '<div class="boat-card '+cardClass+'">';
        html += '  <div class="boat-visto '+(isVisto?"on":"")+'" data-boat="'+b.id+'" data-action="togglevisto" title="Marcar como visto">';
        html += '    <svg viewBox="0 0 24 24" fill="none"><path d="M4 12l5 5L20 6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        html += '  </div>';
        html += '  <div class="boat-info">';
        html += '    <div class="boat-name">'+escapeHtml(b.nombre)+(b.matricula? ' <span class="matricula">'+escapeHtml(b.matricula)+'</span>':'')+'</div>';
        html += '    <div class="boat-meta"><span class="amarre">'+escapeHtml(b.amarre)+'</span>'+escapeHtml(b.descripcion)+'</div>';
        html += '    <button class="obs-toggle" data-action="toggleobs" data-boat="'+b.id+'">'+(obsOpen? "ocultar observación":"añadir observación")+'</button>';
        if(obsOpen){
          html += '    <input class="obs-input" data-action="obsinput" data-boat="'+b.id+'" placeholder="Observación (opcional)" value="'+escapeHtml((salida&&salida.obs)||"")+'">';
        }
        html += '  </div>';
        html += '  <div class="boat-salida" data-boat="'+b.id+'" data-action="toggle">';
        html += '    <span class="boat-salida-label">Salida</span>';
        html += '    <div class="boat-check '+(isChecked?"on":"")+'">';
        html += '      <svg viewBox="0 0 24 24" fill="none"><path d="M4 12l5 5L20 6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        html += '    </div>';
        html += '  </div>';
        html += '</div>';
      });
      html += '</div>';
    }

    if(entradasZona.length){
      html += '<div class="extra-list">';
      html += '  <div class="extra-title">Entradas añadidas en esta zona</div>';
      html += '  <div class="boat-list">';
      entradasZona.forEach(function(e){
        html += '<div class="boat-card entrada">';
        html += '  <div class="boat-info">';
        html += '    <div class="boat-name">'+escapeHtml(e.embarcacion)+(e.matricula? ' <span class="matricula">'+escapeHtml(e.matricula)+'</span>':'')+'</div>';
        html += '    <div class="boat-meta"><span class="amarre">'+escapeHtml(e.atraque)+'</span>'+(e.observaciones? escapeHtml(e.observaciones):'')+'</div>';
        html += '  </div>';
        html += '  <button class="remove-btn" data-action="removeentrada" data-id="'+e.id+'">×</button>';
        html += '</div>';
      });
      html += '  </div>';
      html += '</div>';
    }

    html += '<div class="fab-row"><button class="btn btn-coral" data-action="openentrada">+ Añadir entrada en esta zona</button></div>';
    html += '</main>';
    if(state.tabsVertical){ html += '</div>'; }

    root.innerHTML = html;
    bindEvents();

    if(modalState){
      renderModal();
    }
  }

  function renderTabs(){
    var vClass = state.tabsVertical ? " vertical" : "";
    var h = '<div class="tabbar-wrap'+vClass+'"><div class="tabbar'+vClass+'">';
    state.zoneOrder.forEach(function(z){
      var count = state.boats.filter(function(b){ return b.zona===z; }).length;
      var active = z===state.currentZone;
      h += '<button class="tab '+(active?"active":"")+'" data-zone="'+z+'" data-action="tab">'+
           escapeHtml(z)+'<span class="count">'+count+'</span></button>';
    });
    h += '</div></div>';
    return h;
  }

  function renderModal(){
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    var prefix = zonePrefix(modalState.zona);
    var atraqueFieldHtml = prefix
      ? '<div class="field"><label>Atraque</label><div class="atraque-input"><span class="atraque-prefix">'+escapeHtml(prefix)+'</span><input id="m_atraque_num" inputmode="numeric" placeholder="Número"></div></div>'
      : '<div class="field"><label>Atraque</label><input id="m_atraque_free" placeholder="Código de amarre"></div>';
    overlay.innerHTML =
      '<div class="modal">'+
        '<h3>Añadir entrada — Zona '+escapeHtml(modalState.zona)+'</h3>'+
        '<div class="field"><label>Embarcación</label><input id="m_embarcacion" placeholder="Nombre (si se conoce)"></div>'+
        '<div class="field"><label>Matrícula</label><input id="m_matricula" placeholder="Matrícula (si se conoce)"></div>'+
        atraqueFieldHtml+
        '<div class="field"><label>Observaciones</label><textarea id="m_observaciones" rows="4" placeholder="Cualquier información necesaria"></textarea></div>'+
        '<div class="modal-actions">'+
          '<button class="btn btn-outline" id="m_cancel">Cancelar</button>'+
          '<button class="btn btn-sea" id="m_save">Guardar</button>'+
        '</div>'+
      '</div>';
    document.body.appendChild(overlay);
    document.getElementById("m_cancel").onclick = function(){ overlay.remove(); closeModal(); };
    document.getElementById("m_save").onclick = function(){
      var embarcacion = document.getElementById("m_embarcacion").value.trim();
      var matricula = document.getElementById("m_matricula").value.trim();
      var atraque;
      if(prefix){
        var num = document.getElementById("m_atraque_num").value.trim();
        atraque = num ? (prefix + num) : prefix;
      } else {
        atraque = document.getElementById("m_atraque_free").value.trim();
      }
      var observaciones = document.getElementById("m_observaciones").value.trim();
      var zona = modalState.zona;
      // Cerramos el modal ANTES de llamar a addEntrada: addEntrada dispara
      // render() internamente, y si modalState siguiera activo en ese
      // momento se volvería a crear un modal nuevo por encima del actual
      // (el original ya no se ve, aunque los datos sí se guardan) — parece
      // que "Guardar" no hace nada.
      overlay.remove();
      modalState = null;
      addEntrada(zona, {
        embarcacion: embarcacion,
        matricula: matricula,
        atraque: atraque,
        observaciones: observaciones
      });
    };
  }

        '<h2>Sube el listado de embarcaciones</h2>'+
        '<p>Sube el Excel que os facilita administración. La app creará automáticamente una pestaña por cada zona (columna de código de amarre).</p>'+
        '<label class="btn btn-sea">Seleccionar archivo Excel<input type="file" id="fileInputInitial" accept=".xlsx,.xls"></label>'+
      '</div></div>';
    document.getElementById("fileInputInitial").addEventListener("change", function(e){
      handleFile(e.target.files[0]);
    });
  }

  function bindEvents(){
    var fi = document.getElementById("fileInput");
    if(fi) fi.addEventListener("change", function(e){ handleFile(e.target.files[0]); });

    root.querySelectorAll('[data-action="tab"]').forEach(function(el){
      el.addEventListener("click", function(){
        // Tras un arrastre para reordenar, el navegador dispara igualmente
        // un "click" al soltar; se ignora esa vez para no cambiar de zona.
        if(Date.now() < state.tabDragSuppressUntil){ return; }
        state.currentZone = el.getAttribute("data-zone");
        render();
      });
      el.addEventListener("pointerdown", function(ev){ onTabPointerDown(el, ev); });
    });

    root.querySelectorAll('[data-action="toggle"]').forEach(function(el){
      el.addEventListener("click", function(){ toggleSalida(el.getAttribute("data-boat")); });
    });
    root.querySelectorAll('[data-action="togglevisto"]').forEach(function(el){
      el.addEventListener("click", function(){ toggleVisto(el.getAttribute("data-boat")); });
    });
    root.querySelectorAll('[data-action="toggleobs"]').forEach(function(el){
      el.addEventListener("click", function(){
        var id = el.getAttribute("data-boat");
        state.obsOpen[id] = !state.obsOpen[id];
        render();
      });
    });
    root.querySelectorAll('[data-action="obsinput"]').forEach(function(el){
      el.addEventListener("change", function(){ setObs(el.getAttribute("data-boat"), el.value); });
    });
    root.querySelectorAll('[data-action="removeentrada"]').forEach(function(el){
      el.addEventListener("click", function(){ removeEntrada(el.getAttribute("data-id")); });
    });
    var openBtn = root.querySelector('[data-action="openentrada"]');
    if(openBtn) openBtn.addEventListener("click", function(){ openEntradaModal(state.currentZone); });

    var printBtn = root.querySelector('[data-action="print"]');
    if(printBtn) printBtn.addEventListener("click", doPrint);

    var toggleTabsBtn = root.querySelector('[data-action="toggletabs"]');
    if(toggleTabsBtn) toggleTabsBtn.addEventListener("click", toggleTabsOrientation);
  }

  loadAll();
})();
</script>
<script>
if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>

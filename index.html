  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--sand);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; letter-spacing:.01em;}

  #app{display:flex; flex-direction:column; height:100vh; height:100dvh;}

  /* ---------- Header ---------- */
  header{
    background:var(--navy);
    color:#fff;
    padding:14px 18px 10px 18px;
    flex-shrink:0;
  }
  .header-row{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand svg{flex-shrink:0;}
  .brand-logo{height:32px; width:auto; flex-shrink:0; border-radius:6px; display:block;}
  .brand-text h1{font-size:15px; margin:0; font-weight:700; letter-spacing:.02em;}
  .brand-text span{font-size:12px; color:var(--header-muted);}
  .header-actions{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .header-actions .btn{justify-content:center; text-align:center;}
  .status-total{font-size:12px; color:#fff; font-weight:700; margin-top:2px;}
  .btn{
    border:none; border-radius:8px; padding:9px 14px; font-size:13px; font-weight:600;
    cursor:pointer; display:inline-flex; align-items:center; gap:6px; transition:filter .15s, transform .05s;
    font-family:inherit;
  }
  .btn:active{transform:translateY(1px);}
  .btn-ghost{background:rgba(255,255,255,.1); color:#fff;}
  .btn-ghost:hover{background:rgba(255,255,255,.18);}
  .btn-sea{background:var(--sea); color:#fff;}
  .btn-sea:hover{filter:brightness(1.08);}
  .btn-coral{background:var(--coral); color:#fff;}
  .btn-coral:hover{filter:brightness(1.08);}
  .btn-outline{background:transparent; border:1px solid var(--line); color:var(--ink);}
  .btn-outline:hover{background:#eaeee9;}
  .btn:disabled{opacity:.5; cursor:not-allowed;}

  .status-line{font-size:12px; color:var(--header-muted); margin-top:6px;}

  /* ---------- Tabs ---------- */
  .body-row{display:flex; flex-direction:row; flex:1; min-height:0;}
  .tabbar-wrap{
    background:var(--navy-2);
    overflow-x:auto;
    flex-shrink:0;
    border-bottom:3px solid var(--sea);
  }
  .tabbar-wrap.vertical{
    overflow-x:hidden;
    overflow-y:auto;
    border-bottom:none;
    border-right:3px solid var(--sea);
    width:150px;
    flex-shrink:0;
  }
  .tabbar{
    display:flex;
    flex-direction:row;
    gap:2px;
    padding:0 8px;
    min-width:max-content;
  }
  .tabbar.vertical{
    flex-direction:column;
    padding:8px;
    min-width:0;
    gap:4px;
  }
  .tabbar.vertical .tab{white-space:normal; text-align:left; border-radius:8px; justify-content:space-between;}
  @media (max-width:480px){
    .tabbar-wrap.vertical{width:110px;}
    .tabbar.vertical .tab{font-size:11px; padding:8px 8px;}
  }
  .tab{
    padding:10px 16px;
    font-size:13px;
    font-weight:700;
    color:#cddbe6;
    background:transparent;
    border:none;
    cursor:pointer;
    white-space:nowrap;
    border-radius:8px 8px 0 0;
    position:relative;
    display:flex; align-items:center; gap:6px;
  }
  .tab.active{background:var(--sand); color:var(--navy);}
  .tab .count{
    font-family:-apple-system,sans-serif; font-weight:600; font-size:10px;
    background:rgba(255,255,255,.15); color:#fff; padding:1px 6px; border-radius:20px;
  }
  .tab.active .count{background:var(--sea); color:#fff;}
  .tab{ touch-action:pan-x; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  .tabbar.vertical .tab{ touch-action:pan-y; }
  .tab.dragging{ opacity:.55; outline:2px dashed var(--coral); outline-offset:-2px; cursor:grabbing; }

  /* ---------- Content ---------- */
  main{flex:1; overflow-y:auto; padding:16px;}
  .zone-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; flex-wrap:wrap; gap:10px;}
  .zone-title{font-size:16px; font-weight:700; color:var(--navy);}
  .zone-progress{font-size:12px; color:var(--muted);}
  .zone-side{display:flex; flex-direction:column; align-items:flex-end; gap:6px; margin-left:auto;}
  .sort-btn{
    width:26px; height:26px; margin-right:24px; padding:0; border-radius:7px; border:2px solid var(--sea);
    background:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center;
    font-size:15px; line-height:1; -webkit-tap-highlight-color:transparent;
  }
  .sort-btn.desc{background:var(--entrada-bg);}
  .zone-tools{display:flex; align-items:center; justify-content:flex-end; gap:8px; flex-wrap:wrap; margin-bottom:10px;}
  .swap-btn{
    border:none; border-radius:8px; padding:6px 12px; font-size:12px; font-weight:600;
    background:var(--navy); color:#fff; cursor:pointer; font-family:inherit; -webkit-tap-highlight-color:transparent;
  }
  .swap-btn:active{transform:translateY(1px);}
  /* Casillas de marcación: Salida (roja, sin etiqueta) y Visto (verde, con etiqueta) */
  .mark{display:flex; flex-direction:column; align-items:center; gap:3px; width:48px; flex-shrink:0; cursor:pointer; -webkit-tap-highlight-color:transparent;}
  .mark-box{
    width:26px; height:26px; border-radius:7px; border:2px solid; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .mark-box svg{display:none; width:16px; height:16px; stroke:#fff;}
  .mark-box.on svg{display:block;}
  .mark-salida .mark-box{border-color:var(--exit); background:var(--exit-bg);}
  .mark-salida .mark-box.on{background:var(--exit);}
  .mark-visto .mark-box{border-color:var(--ok); background:#dcefe0;}
  .mark-visto .mark-box.on{background:var(--ok);}
  .mark-label{font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.04em;}
  .mark-label{font-size:10px;}
  .boat-card.visto .mark-visto .mark-label{color:var(--ok);}
  .boat-card.checked .mark-salida .mark-label{color:var(--exit);}
  .sort-btn:active{transform:translateY(1px);}

  .boat-list{display:flex; flex-direction:column; gap:8px;}
  .boat-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:10px 12px;
    display:flex; align-items:center; gap:12px;
  }
  .boat-card.visto{background:var(--entrada-bg); border-color:var(--entrada-border);}
  .boat-card.checked{background:var(--exit-bg); border-color:var(--exit-border);}
  .boat-visto{
    flex-shrink:0; width:24px; height:24px; border-radius:7px; border:2px solid var(--ok);
    display:flex; align-items:center; justify-content:center; cursor:pointer; background:#fff;
  }
  .boat-visto.on{background:var(--ok);}
  .boat-visto svg{display:none; width:14px; height:14px; stroke:#fff;}
  .boat-visto.on svg{display:block;}
  .boat-check{
    flex-shrink:0; width:26px; height:26px; border-radius:7px; border:2px solid var(--sea);
    display:flex; align-items:center; justify-content:center; cursor:pointer; background:#fff;
  }
  .boat-check.on{background:var(--exit);}
  .boat-check svg{display:none; width:16px; height:16px; stroke:#fff;}
  .boat-check.on svg{display:block;}
  .boat-info{flex:1; min-width:0;}
  .boat-name{font-weight:700; font-size:14px; color:var(--ink);}
  .boat-name .matricula{display:block; font-weight:700; color:var(--sea-dark); margin-top:1px;}
  .boat-meta{font-size:12px; color:var(--muted); margin-top:2px;}
  .boat-meta .amarre{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; color:var(--sea-dark); font-weight:700; margin-right:8px;}
  .boat-salida{display:flex; align-items:center; gap:8px; flex-shrink:0; cursor:pointer; padding-left:8px;}
  .boat-salida-label{font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.04em;}
  .boat-card.checked .boat-salida-label{color:var(--exit);}
  .obs-toggle{
    font-size:11px; color:var(--sea-dark); background:none; border:none; cursor:pointer; padding:4px 0;
    text-decoration:underline;
  }
  .obs-input{
    margin-top:6px; width:100%; font-size:12px; padding:6px 8px; border:1px solid var(--line);
    border-radius:6px; font-family:inherit;
  }

  .extra-list{margin-top:18px;}
  .extra-title{font-size:13px; font-weight:700; color:var(--navy); margin-bottom:8px;}
  .boat-card.entrada{background:var(--entrada-bg); border-color:var(--entrada-border);}
  .remove-btn{
    background:none; border:none; color:var(--coral); cursor:pointer; font-size:18px; line-height:1; padding:4px 8px; flex-shrink:0;
  }

  .empty-state{color:var(--muted); font-size:13px; padding:30px 10px; text-align:center;}

  /* ---------- Floating add button ---------- */
  .fab-row{position:sticky; bottom:0; display:flex; justify-content:flex-end; padding-top:12px;}

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(36,34,84,.55); display:flex; align-items:center; justify-content:center;
    padding:16px; z-index:50;
  }
  .modal{
    background:#fff; border-radius:12px; padding:20px; width:100%; max-width:420px; max-height:90vh; overflow-y:auto;
  }
  .modal h3{margin:0 0 14px 0; font-size:16px; color:var(--navy);}
  .field{margin-bottom:10px;}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:4px; font-weight:600;}
  .field input, .field select, .field textarea{
    width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:7px; font-size:14px; font-family:inherit;
  }
  .field textarea{resize:vertical; min-height:84px;}
  .field input{min-height:52px;}
  .atraque-input input{min-height:50px;}
  .atraque-input{display:flex; align-items:stretch; border:1px solid var(--line); border-radius:7px; overflow:hidden;}
  .atraque-input .atraque-prefix{
    background:#f0ede3; color:var(--muted); font-weight:700; padding:0 10px; display:flex; align-items:center;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  .atraque-input input{border:none; border-radius:0; flex:1; padding:9px 10px; font-size:14px; font-family:inherit;}
  .modal-actions{display:flex; gap:8px; justify-content:flex-end; margin-top:16px;}

  /* ---------- Previsualización de impresión ---------- */
  .print-preview{
    background:#fff; border-radius:12px; width:100%; max-width:720px; max-height:92vh;
    display:flex; flex-direction:column; overflow:hidden; box-shadow:0 10px 40px rgba(0,0,0,.3);
  }
  .print-preview-toolbar{
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    padding:14px 18px; border-bottom:1px solid var(--line); flex-shrink:0;
  }
  .print-preview-toolbar h3{margin:0; font-size:15px; color:var(--navy);}
  .print-preview-actions{display:flex; gap:8px;}
  .print-preview-scroll{flex:1; overflow-y:auto; overflow-x:hidden; background:#d9d9d9; padding:20px;}
  @media (max-width:640px){
    .overlay.pp-overlay{padding:8px;}
    .print-preview-scroll{padding:10px;}
    .print-preview-toolbar{padding:10px 12px;}
  }
  .pp-fit{margin:0 auto; overflow:hidden;}
  .print-preview-paper{
    background:#fff; width:600px; margin:0; padding:24px 8px; transform-origin:top left;
    box-shadow:0 2px 10px rgba(0,0,0,.18); border-radius:2px;
  }

  /* ---------- Upload screen ---------- */
  .upload-screen{
    flex:1; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .upload-box{
    background:#fff; border:2px dashed var(--line); border-radius:14px; padding:0 28px 36px 28px; text-align:center; max-width:420px; overflow:hidden;
  }
  .upload-banner{
    height:16px; margin:0 -28px 24px -28px;
    background-image:var(--logo-tile-uri); background-repeat:repeat-x; background-position:left top; background-size:auto 16px;
  }
  .upload-logo{height:56px; width:auto; display:block; margin:0 auto 14px auto; border-radius:8px;}
  .upload-box h2{color:var(--navy); font-size:17px; margin:10px 0 6px 0;}
  .upload-box p{color:var(--muted); font-size:13px; line-height:1.5; margin:0 0 18px 0;}
  input[type="file"]{display:none;}

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--navy); color:#fff; padding:10px 18px; border-radius:30px; font-size:13px; z-index:100;
    box-shadow:0 6px 20px rgba(0,0,0,.25);
  }

  /* ---------- Print ---------- */
  #printArea{display:none;}
  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{display:block; position:absolute; top:0; left:0; width:100%; padding:20px;}
  }
  .p-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:16px;}
  .p-logo{display:flex; flex-direction:column; align-items:center; width:90px;}
  .p-logo-sq{width:80px; height:80px; overflow:hidden; flex-shrink:0;}
  .p-logo-sq img{width:100%; height:100%; display:block; object-fit:cover;}
  .p-logo-caption{
    margin-top:6px; font-family:Georgia,"Times New Roman",serif; font-style:italic; font-weight:700;
    color:var(--p-blue); text-align:center; line-height:1.15; font-size:11px;
  }
  .p-title{font-size:19px; font-weight:800; color:var(--p-blue); text-align:right; letter-spacing:.02em;}
  .p-date{font-size:12px; color:var(--p-blue); text-align:right; margin-top:10px;}
  .p-section-title{font-size:14px; font-weight:800; color:var(--p-blue); text-align:center; margin:18px 0 6px 0; text-transform:uppercase; letter-spacing:.05em;}
  table.p-table{width:100%; border-collapse:collapse; font-size:11px; table-layout:fixed;}
  table.p-table th{border:1px solid var(--p-blue); padding:5px 7px; text-align:center; background:#fff; color:var(--p-blue); font-weight:700;}
  table.p-table td{color:#1c1b33; border-left:1px solid var(--p-blue); border-right:1px solid var(--p-blue); padding:5px 7px; text-align:left;}
  table.p-table tbody tr:last-child td{border-bottom:1px solid var(--p-blue);}
  table.p-table{border-left:1px solid var(--p-blue); border-right:1px solid var(--p-blue); border-bottom:1px solid var(--p-blue);}
  table.p-table td.empty-row{color:var(--p-blue); opacity:.75; font-style:italic; border-bottom:1px solid var(--p-blue);}
  table.p-table td .p-matricula{color:#1c1b33; font-weight:700; margin-left:6px;}
  table.p-table col.p-c-embarcacion{width:28%;}
  table.p-table col.p-c-tipo{width:12%;}
  table.p-table col.p-c-bandera{width:16%;}
  table.p-table col.p-c-atraque{width:14%;}
  table.p-table col.p-c-obs{width:30%;}
</style>

<style>
/* ===== Capa de diseño corporativo Puerto Sotogrande (DESIGN-puertosotogrande-es.md) ===== */
:root{
  color-scheme:light;
  --navy:#20305a;          /* texto primario / azul corporativo */
  --navy-2:#182648;        /* barra de pestañas */
  --sea:#1a5632;           /* verde corporativo (botón relleno) */
  --sea-dark:#1a5632;
  --sky:#3ea8e0;           /* acento secundario */
  --lime:#25d366;          /* acento brillante, uso puntual */
  --sand:#e2e2e2;          /* lienzo principal */
  --card:#ffffff;
  --cream:#fbf7f3;         /* superficie secundaria */
  --ink:#20305a;
  --muted:#666666;
  --line:#d6d8dc;
  --coral:#30799b;         /* sustituye el coral: azul petróleo de la paleta */
  --ok:#1a5632;
  --entrada-bg:#e4f1e7;
  --entrada-border:#a9d1b4;
  --header-muted:#b9c3dc;
  --radius:6px;
  --shadow-hi:rgba(0,0,0,.19) 0 10px 20px 0, rgba(0,0,0,.23) 0 6px 6px 0;
  --shadow-tint:rgba(32,48,90,.18) 1px 6px 24px 0;
  --f-display:"DM Serif Display",Georgia,"Times New Roman",serif;
  --f-body:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
body{background:var(--sand); color:var(--ink); font-family:var(--f-body); font-weight:400;}
#app{background:var(--sand);}

/* Cabecera */
header{background:var(--navy); padding:14px 18px 10px 18px; border-bottom:3px solid var(--sea);}
header .btn{min-height:0; padding:9px 14px; font-size:13px; line-height:15px;}
header .btn-ghost{padding:8px 14px;}
header .status-line,header .status-total{line-height:14px;}
.brand-logo{border-radius:5px; background:#fff; padding:2px;}
.brand-text h1{font-family:var(--f-display); font-weight:400; font-size:17px; letter-spacing:-.2px; line-height:18px;}
.brand-text span{display:block; font-size:11px; letter-spacing:.04em; font-weight:500; line-height:14px; margin-top:1px;}
.brand-text h1{line-height:17px;}
.brand-logo{padding:0;}
.status-line{font-size:12px;}
.status-total{font-weight:700; letter-spacing:.02em;}

/* Botones */
.btn{border-radius:6px; font-family:var(--f-body); font-weight:600; letter-spacing:.02em; min-height:44px; padding:10px 16px;}
.btn-ghost{background:transparent; color:#fff; border:1px solid rgba(255,255,255,.35);}
.btn-ghost:hover{background:rgba(255,255,255,.1);}
.btn-sea{background:var(--sea); color:#fff;}
.btn-coral{background:var(--cream); color:var(--navy);}
.btn-coral:hover{filter:none; background:#fff;}
.btn-outline{border:1px solid var(--navy); color:var(--navy); background:#fff;}
.btn-outline:hover{background:var(--cream);}
.btn:focus-visible,.tab:focus-visible,.sort-btn:focus-visible{outline:2px solid var(--sky); outline-offset:2px;}

/* Pestañas */
.tabbar-wrap{background:var(--navy-2); border-bottom:none;}
.tabbar-wrap.vertical{border-right:none;}
.tabbar{padding:6px 8px 0; gap:4px;}
.tab{font-family:var(--f-body); font-weight:600; font-size:13px; color:#c9d2e6; border-radius:6px 6px 0 0; letter-spacing:.01em;}
.tab:hover{color:#fff;}
.tab.active{background:var(--sand); color:var(--navy); font-weight:800; box-shadow:inset 0 3px 0 var(--sea);}
.tabbar.vertical .tab{border-radius:6px;}
.tabbar.vertical .tab.active{box-shadow:inset 3px 0 0 var(--sea);}
.tab .count{font-family:var(--f-body); font-variant-numeric:tabular-nums;}
.tab.active .count{background:var(--sea);}
.tab.dragging{outline-color:var(--sky);}

/* Contenido */
main{padding:18px 16px;}
.zone-title{font-family:var(--f-display); font-weight:400; font-size:26px; letter-spacing:-.5px; color:var(--navy); line-height:1.1;}
.zone-progress{font-size:12px; letter-spacing:.04em; text-transform:uppercase; font-weight:600; color:var(--muted); font-variant-numeric:tabular-nums;}
.sort-btn{border-radius:6px; border-color:var(--sea);}
.sort-btn.desc{background:var(--entrada-bg);}
.obs-fields{display:flex; flex-direction:column; gap:2px; margin-top:4px;}
.obs-lbl{font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-top:6px;}
.obs-fields .obs-input{margin-top:0; min-height:36px; font-size:14px; color:var(--navy); background:#fff;}
.obs-fields .obs-text{resize:vertical; min-height:56px;}
.obs-summary{font-size:12px; color:var(--navy); margin-top:4px; line-height:1.4;}
.swap-btn{border-radius:6px; background:var(--navy); font-family:var(--f-body);}

.boat-list{gap:6px;}
.boat-card{border-radius:6px; border:1px solid transparent; background:var(--card); padding:12px 12px; box-shadow:0 1px 0 rgba(32,48,90,.06);}
.boat-name{font-weight:700; font-size:15px; color:var(--navy);}
.boat-name .matricula{font-weight:600; color:var(--sea); font-size:13px; letter-spacing:.02em;}
.boat-meta{color:var(--muted);}
.boat-meta .amarre{color:var(--navy); background:var(--cream); padding:1px 6px; border-radius:4px; font-variant-numeric:tabular-nums;}
.mark-box{border-radius:6px;}
.mark-visto .mark-box{background:#e4f1e7;}
.mark-label{font-family:var(--f-body); letter-spacing:.08em;}
.obs-toggle{color:var(--sky); text-decoration:none; font-weight:600;}
.obs-input{border-radius:6px; font-family:var(--f-body);}
.extra-title{font-family:var(--f-display); font-weight:400; font-size:19px; color:var(--navy);}
.remove-btn{color:#b23a2e;}

/* Modales */
.overlay{background:rgba(32,48,90,.55);}
.modal{border-radius:6px; box-shadow:var(--shadow-hi); background:var(--cream);}
.modal h3{font-family:var(--f-display); font-weight:400; font-size:24px; letter-spacing:-.5px; color:var(--navy);}
.field label{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted);}
.field input,.field select,.field textarea{border-radius:6px; border-color:var(--line); background:#fff; font-family:var(--f-body); color:var(--navy);}
.atraque-input{border-radius:6px; background:#fff;}
.atraque-input .atraque-prefix{background:var(--sand); color:var(--navy);}
.print-preview{border-radius:6px; box-shadow:var(--shadow-hi);}
.print-preview-toolbar h3{font-family:var(--f-display); font-weight:400; font-size:21px; color:var(--navy);}

/* Pantalla de subida */
.upload-box{border:none; border-radius:6px; background:var(--cream); box-shadow:var(--shadow-tint);}
.upload-box h2{font-family:var(--f-display); font-weight:400; font-size:28px; letter-spacing:-1px; line-height:1.15; color:var(--navy); text-wrap:balance;}
.upload-box p{font-size:14px; font-weight:400; color:var(--muted); line-height:1.7;}

.toast{background:var(--navy); border-radius:100px; font-family:var(--f-body); box-shadow:var(--shadow-tint);}

/* ---- Cabecera compacta en móvil ---- */
.header-left{display:flex; flex-direction:column; gap:6px; min-width:0;}
.m-show{display:none;}
.brand-text h1 .h1-l2{display:inline; font:inherit; color:inherit; letter-spacing:inherit; margin:0; line-height:inherit;}
@media (max-width:640px){
  header{padding:8px 12px 8px 12px;}
  .header-row{flex-wrap:nowrap; align-items:center; gap:8px;}
  .header-left{flex:1 1 auto; gap:4px;}
  .brand{gap:8px; align-items:center;}
  .brand-logo{height:30px;}
  .brand-text h1{font-size:16px; line-height:17px;}
  .brand-text h1 .h1-l2{display:block;}
  .brand-text span:not(.h1-l2){font-size:10px; line-height:12px; margin-top:1px;}
  header .status-line,header .status-total{font-size:10px; line-height:12px; margin-top:0;}
  .header-status .status-line{white-space:normal;}
  .header-actions{flex:0 0 auto; gap:4px; grid-template-columns:1fr;}
  .header-actions > span[aria-hidden]{display:none;}
  .brand-text h1, header .status-line, header .status-total{white-space:nowrap;}
  .m-hide{display:none;}
  .m-show{display:inline !important;}
  header .btn{padding:6px 9px; font-size:11px; line-height:13px; border-radius:5px; letter-spacing:0;}
  header .btn-ghost{padding:5px 9px;}
}
/* El parte exportado conserva su formato original */
.print-preview-paper,#printArea,.p-head,.p-section-title,.p-date,.p-title,table.p-table{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
@media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>

    tabScroll: {x:0, y:0}, // posición de la barra de pestañas
    sortDesc: {}          // zonas con la lista en orden descendente
  };

  function todayKey(){
    var d = new Date();
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  function todayDDMMYYYY(){
    var d = new Date();
    return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear();
  }
  function todayLabel(){
    var d = new Date();
    var meses = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
    return { dia: d.getDate(), mes: meses[d.getMonth()], anio: d.getFullYear() };
  }
  function escapeHtml(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  var ZONE_ORDER_DEFAULT = [
    "Muelle Espera","Motos","P1-P5","Muelle Ribera","Arlequín","Guramí","Obispo","Canal",
    "Marlin","Sierra","Caballito","Nécora","Dragoncillo","Corvo","Vela","Romana",
    "Tortuga","Alboaire","Barbero","Golondrina","Luna","Carey","Guadalmarina",
    "Loro","Barbesula","Emperador","Delfín","Volador","Candil","Arquero",
    "Contradique","Extra"
  ];

  // Prefijo alfabético representativo de cada zona (para el alta manual de
  // entradas: el marinero solo escribe el número, el prefijo se da por hecho).
  // "Extra" no tiene prefijo fijo: el atraque se escribe libremente.
  var ZONE_PREFIX = {
    "Muelle Espera":"ME", "Motos":"MTA", "P1-P5":"A", "Muelle Ribera":"A",
    "Arlequín":"AL", "Guramí":"GU", "Obispo":"OB", "Canal":"CAN",
    "Marlin":"M", "Sierra":"SR", "Caballito":"CB", "Nécora":"NE",
    "Dragoncillo":"DR", "Corvo":"CV", "Vela":"IV", "Romana":"RM",
    "Tortuga":"IT", "Alboaire":"AB", "Barbero":"PB", "Golondrina":"GL",
    "Luna":"PL", "Carey":"IC", "Guadalmarina":"GM", "Loro":"LR",
    "Barbesula":"BB", "Emperador":"EM", "Delfín":"DL", "Volador":"PV",
    "Candil":"CD", "Arquero":"AQ", "Contradique":"A"
  };
  function zonePrefix(zona){ return ZONE_PREFIX[zona] || null; }

  function classifyZone(amarreRaw){
    var amarre = String(amarreRaw||"").trim().toUpperCase();
    var m = /^([A-ZÁÉÍÓÚÑ]+)(\d+)?/.exec(amarre);
    var letters = m ? m[1] : amarre;
    var num = (m && m[2]) ? parseInt(m[2],10) : null;
    function starts(code){ return letters.indexOf(code) === 0; }

    if(starts("ME")) return "Muelle Espera";
    if(starts("MTA")) return "Motos";
    if(starts("ARCO")) return "Contradique";
    if(letters === "A"){
      if(num !== null){
        if(num >= 0 && num <= 378) return "P1-P5";
        if(num >= 379 && num <= 401) return "Muelle Ribera";
        if(num >= 402 && num <= 548) return "Contradique";
      }
      return "Extra";
    }
    if(letters === "M") return "Marlin";
    if(starts("AL")) return "Arlequín";
    if(starts("GU")) return "Guramí";
    if(starts("OB")) return "Obispo";
    if(starts("CAN")) return "Canal";
    if(starts("SR")) return "Sierra";
    if(starts("CB")) return "Caballito";
    if(starts("NE")) return "Nécora";
    if(starts("DR")) return "Dragoncillo";
    if(starts("CV")) return "Corvo";
    if(starts("IV")) return "Vela";
    if(starts("RM")) return "Romana";
    if(starts("IT")) return "Tortuga";
    if(starts("AB")) return "Alboaire";
    if(starts("PB")) return "Barbero";
    if(starts("GL")) return "Golondrina";
    if(starts("PL")) return "Luna";
    if(starts("IC")) return "Carey";
    if(starts("GM")) return "Guadalmarina";
    if(starts("LR") || starts("LJ")) return "Loro";
    if(starts("BB") || starts("BP")) return "Barbesula";
    if(starts("EM")) return "Emperador";
    if(starts("DL")) return "Delfín";
    if(starts("PV")) return "Volador";
    if(starts("CD")) return "Candil";
    if(starts("AQ")) return "Arquero";
    return "Extra";
  }
  function toast(msg){
    var t = document.createElement("div");
    t.className = "toast";
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function(){ t.remove(); }, 2600);
  }

  // ---------------- Storage ----------------
  // Dos capas de guardado, para que nunca se pierda nada:
  //  1) localStorage del propio dispositivo/navegador: siempre disponible,
  //     no depende de conexión ni de la capacidad "db" de Claude, y se
  //     escribe en cada cambio. Es la copia que garantiza que nada se
  //     pierde al cerrar la pestaña, recargar o reiniciar el dispositivo.
  //  2) capacidad "db" de Claude (solo cuando la app se abre publicada como
  //     artefacto): guardado compartido entre varios usuarios/dispositivos
  //     a la vez. Si no está disponible (archivo .html abierto suelto), la
  //     app sigue funcionando igual apoyándose solo en localStorage.
  var dbApi = null;
  var LS_PREFIX = "gestorEmbarcaciones.";
  var LS_MASTER = LS_PREFIX + "master";
  var LS_ORDER = LS_PREFIX + "zoneOrder";
  var LS_DAY_PREFIX = LS_PREFIX + "day.";
  var LS_TABS_VERTICAL = LS_PREFIX + "tabsVertical";
  var LS_CHECKS_SWAP = LS_PREFIX + "checksSwapped";
  var LS_SORT = LS_PREFIX + "sortDesc"; // orden ascendente/descendente por zona
  var LS_VIEW = LS_PREFIX + "view"; // zona actual + posiciones de desplazamiento

  function lsGet(key){
    try{
      var raw = window.localStorage.getItem(key);
      return raw==null ? null : JSON.parse(raw);
    }catch(e){ return null; }
  }
  function lsSet(key, value){
    try{
      window.localStorage.setItem(key, JSON.stringify(value));
      return true;
    }catch(e){ return false; }
  }

  async function initDb(){
    try{
      if(window.claude && typeof window.claude.use === "function"){
        dbApi = await window.claude.use("db");
      }
    }catch(e){ dbApi = null; }
  }

  async function loadAll(){
    await initDb();

    var masterLoaded = false;
    if(dbApi){
      try{
        var masterSnap = await dbApi.doc("state/master").get();
        if(masterSnap.exists){
          var parsed = masterSnap.data();
          state.boats = parsed.boats || [];
          state.masterUpdatedAt = parsed.updatedAt;
          masterLoaded = true;
        }
      }catch(e){ /* no existe aún */ }

      try{
        var orderSnap = await dbApi.doc("state/zoneOrder").get();
        if(orderSnap.exists){
          var orderData = orderSnap.data();
          if(orderData.order) state.zoneOrder = orderData.order;
        }
      }catch(e){}
    }

    if(!masterLoaded){
      var localMaster = lsGet(LS_MASTER);
      if(localMaster){
        state.boats = localMaster.boats || [];
        state.masterUpdatedAt = localMaster.updatedAt || null;
      }
      if(!state.zoneOrder.length){
        var localOrder = lsGet(LS_ORDER);
        if(localOrder && localOrder.order) state.zoneOrder = localOrder.order;
      }
    }

    if(state.boats.length){
      ensureZoneOrder();
      state.currentZone = state.zoneOrder[0] || null;
      var view = lsGet(LS_VIEW);
      if(view){
        if(view.currentZone && state.zoneOrder.indexOf(view.currentZone) !== -1) state.currentZone = view.currentZone;
        state.listScroll = view.listScroll || {};
        state.tabScroll = view.tabScroll || {x:0, y:0};
      }
    }

    state.sortDesc = lsGet(LS_SORT) || {};
    var savedTabsVertical = lsGet(LS_TABS_VERTICAL);
    state.tabsVertical = !!(savedTabsVertical && savedTabsVertical.on);
    var savedSwap = lsGet(LS_CHECKS_SWAP);
    state.checksSwapped = !!(savedSwap && savedSwap.on);

    await loadDay();
    state.ready = true;
    render();
  }

  async function loadDay(){
    if(dbApi){
      try{
        var snap = await dbApi.doc("days/"+state.dateKey).get();
        if(snap.exists){
          var data = snap.data();
          state.day = { salidas: data.salidas || {}, entradas: data.entradas || [], vistos: data.vistos || {} };
          return;
        }
      }catch(e){ /* sigue abajo y prueba con la copia local */ }
    }
    var local = lsGet(LS_DAY_PREFIX + state.dateKey);
    state.day = local ? { salidas: local.salidas || {}, entradas: local.entradas || [], vistos: local.vistos || {} } : { salidas:{}, entradas:[], vistos:{} };
  }

  async function saveDay(){
    // Copia local siempre, en cada cambio: es la garantía de que nada se
    // pierde aunque falle la conexión o no haya guardado compartido.
    lsSet(LS_DAY_PREFIX + state.dateKey, state.day);
    if(!dbApi) return;
    try{
      await dbApi.doc("days/"+state.dateKey).set(state.day);
    }catch(e){
      toast("No se pudo sincronizar con el guardado compartido; se ha guardado una copia en este dispositivo.");
    }
  }

  async function saveZoneOrder(){
    lsSet(LS_ORDER, {order: state.zoneOrder});
    if(!dbApi) return;
    try{
      await dbApi.doc("state/zoneOrder").set({order: state.zoneOrder});
    }catch(e){
      toast("No se pudo sincronizar el orden de pestañas; se ha guardado en este dispositivo.");
    }
  }

  function ensureZoneOrder(){
    var zonesPresent = Array.from(new Set(state.boats.map(function(b){ return b.zona; })));
    // conserva orden ya guardado, quita zonas que ya no existan
    var order = (state.zoneOrder||[]).filter(function(z){ return zonesPresent.indexOf(z) !== -1; });
    // añade zonas nuevas siguiendo el orden canónico definido; lo que no esté en ese orden, al final alfabéticamente
    var missing = zonesPresent.filter(function(z){ return order.indexOf(z) === -1; }).sort(function(a,b){
      var ia = ZONE_ORDER_DEFAULT.indexOf(a); if(ia===-1) ia = 999;
      var ib = ZONE_ORDER_DEFAULT.indexOf(b); if(ib===-1) ib = 999;
      if(ia !== ib) return ia-ib;
      return a.localeCompare(b,"es");
    });
    state.zoneOrder = order.concat(missing);
  }

  // ---------------- Excel import ----------------
  function handleFile(file){
    if(!file) return;
    state.uploading = true; render();
    var reader = new FileReader();
    reader.onload = async function(e){
      var boats;
      try{
        var data = new Uint8Array(e.target.result);
        var wb = XLSX.read(data, {type:"array"});
        var sheet = wb.Sheets[wb.SheetNames[0]];
        var rows = XLSX.utils.sheet_to_json(sheet, {header:1, defval:""});
        boats = [];
        for(var i=1;i<rows.length;i++){ // salta cabecera
          var r = rows[i];
          var amarre = (r[0]||"").toString().trim();
          if(!amarre) continue;
          var descripcion = (r[1]||"").toString().trim();
          var nombre = (r[2]||"").toString().trim();
          var matricula = (r[3]||"").toString().trim();
          boats.push({
            id: amarre + "__" + i,
            amarre: amarre,
            zona: classifyZone(amarre),
            descripcion: descripcion,
            nombre: nombre || "(sin nombre)",
            matricula: matricula
          });
        }
      }catch(err){
        toast("Error leyendo el Excel. Comprueba el formato.");
        state.uploading = false; render();
        return;
      }

      if(!boats.length){
        toast("No se han encontrado filas válidas en el Excel.");
        state.uploading = false; render();
        return;
      }

      state.boats = boats;
      ensureZoneOrder();
      state.currentZone = state.zoneOrder[0] || null;
      // Al importar un listado nuevo se reinician las posiciones guardadas.
      state.listScroll = {};
      state.tabScroll = {x:0, y:0};
      root.querySelectorAll("main, .tabbar-wrap").forEach(function(el){ el.scrollTop = 0; el.scrollLeft = 0; });
      saveViewNow();
      state.masterUpdatedAt = new Date().toISOString();

      // Copia local siempre (garantiza que el listado sigue ahí aunque no
      // haya guardado compartido o falle la conexión).
      lsSet(LS_MASTER, {boats: boats, updatedAt: state.masterUpdatedAt});

      if(dbApi){
        try{
          await dbApi.doc("state/master").set({boats: boats, updatedAt: state.masterUpdatedAt});
          await saveZoneOrder();
          toast("Listado actualizado: " + boats.length + " embarcaciones en " + state.zoneOrder.length + " zonas.");
        }catch(err){
          await saveZoneOrder();
          toast("Listado actualizado: " + boats.length + " embarcaciones en " + state.zoneOrder.length + " zonas (guardado en este dispositivo).");
        }
      } else {
        await saveZoneOrder();
        toast("Listado actualizado: " + boats.length + " embarcaciones en " + state.zoneOrder.length + " zonas (guardado en este dispositivo).");
      }

      state.uploading = false;
      render();
    };
    reader.readAsArrayBuffer(file);
  }

  // ---------------- Acciones ----------------
  function toggleSalida(boatId){
    var cur = state.day.salidas[boatId];
    if(cur && cur.checked){
      delete state.day.salidas[boatId];
    } else {
      state.day.salidas[boatId] = { checked:true, obs: (cur && cur.obs) || "" };
    }
    saveDay();
    render();
  }
  function setObs(boatId, text, field){
    if(!state.day.salidas[boatId]) state.day.salidas[boatId] = {checked:true, obs:""};
    state.day.salidas[boatId][field || "obs"] = text;
    saveDay();
  }
  function toggleVisto(boatId){
    if(state.day.vistos[boatId]){
      delete state.day.vistos[boatId];
    } else {
      state.day.vistos[boatId] = true;
    }
    saveDay();
    render();
  }
  function toggleTabsOrientation(){
    state.tabsVertical = !state.tabsVertical;
    lsSet(LS_TABS_VERTICAL, {on: state.tabsVertical});
    render();
  }
  // Texto de observaciones de una entrada: "ELEC. -> x / AGUA -> y / observaciones"
  function fmtObs(elec, agua, obs){
    var parts = [];
    if(elec) parts.push("ELEC. -> " + elec);
    if(agua) parts.push("AGUA -> " + agua);
    if(obs) parts.push(obs);
    return parts.join(" / ");
  }
  function obsEntrada(e){ return fmtObs(e.elec, e.agua, e.observaciones); }
  function obsSalida(x){ x = x || {}; return fmtObs(x.elec, x.agua, x.obs); }
  function addEntrada(zona, data){
    state.day.entradas.push({
      id: "e"+Date.now()+Math.random().toString(36).slice(2,6),
      zona: zona,
      embarcacion: data.embarcacion || "(sin nombre)",
      matricula: data.matricula,
      atraque: data.atraque,
      elec: data.elec || "",
      agua: data.agua || "",
      observaciones: data.observaciones
    });
    saveDay();
    render();
  }
  function removeEntrada(id){
    state.day.entradas = state.day.entradas.filter(function(e){ return e.id !== id; });
    saveDay();
    render();
  }

  function openPrintPreview(){
    buildPrintArea();
    var overlay = document.createElement("div");
    overlay.className = "overlay pp-overlay";
    overlay.innerHTML =
      '<div class="print-preview">'+
        '<div class="print-preview-toolbar">'+
          '<h3>Previsualización del parte</h3>'+
          '<div class="print-preview-actions">'+
            '<button class="btn btn-outline" id="pp_close">Cerrar</button>'+
            '<button class="btn btn-sea" id="pp_export">Compartir</button>'+
          '</div>'+
        '</div>'+
        '<div class="print-preview-scroll"><div class="pp-fit" id="pp_fit"><div class="print-preview-paper" id="pp_paper">'+getPrintHtml()+'</div></div></div>'+
      '</div>';
    document.body.appendChild(overlay);
    // El parte se maqueta siempre a ancho fijo (como una hoja A4) y se
    // escala para que quepa entero en la pantalla, sea cual sea la
    // orientación del móvil. Así nunca se descuadra en vertical.
    var fitPaper = function(){
      var scroller = overlay.querySelector(".print-preview-scroll");
      var fit = document.getElementById("pp_fit");
      var paper = document.getElementById("pp_paper");
      if(!scroller || !fit || !paper) return;
      var cs = getComputedStyle(scroller);
      var avail = scroller.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
      var scale = Math.min(1, avail / paper.offsetWidth);
      paper.style.transform = scale < 1 ? "scale("+scale+")" : "";
      fit.style.width = (paper.offsetWidth * scale) + "px";
      fit.style.height = (paper.offsetHeight * scale) + "px";
    };
    fitPaper();
    var imgs = overlay.querySelectorAll("img");
    for(var i=0;i<imgs.length;i++){ if(!imgs[i].complete) imgs[i].addEventListener("load", fitPaper); }
    window.addEventListener("resize", fitPaper);
    window.addEventListener("orientationchange", fitPaper);
    var closePreview = function(){
      window.removeEventListener("resize", fitPaper);
      window.removeEventListener("orientationchange", fitPaper);
      overlay.remove();
    };
    overlay._closePreview = closePreview;
    document.getElementById("pp_close").onclick = closePreview;
    document.getElementById("pp_export").onclick = function(){ exportPdf(overlay); };
  }

  function exportPdf(overlay){
    var paper = document.getElementById("pp_paper");
    var exportBtn = document.getElementById("pp_export");
    if(!paper || !window.html2canvas || !window.jspdf){
      toast("No se pudo generar el PDF en este dispositivo.");
      return;
    }
    if(exportBtn){ exportBtn.disabled = true; exportBtn.textContent = "Generando…"; }
    // Se captura una copia sin escalar, fuera de pantalla, para que el PDF
    // salga idéntico en cualquier dispositivo u orientación.
    var holder = document.createElement("div");
    holder.style.cssText = "position:fixed; left:-10000px; top:0; width:600px; background:#fff;";
    var clone = paper.cloneNode(true);
    clone.removeAttribute("id");
    clone.style.transform = "none";
    holder.appendChild(clone);
    document.body.appendChild(holder);
    window.html2canvas(clone, { scale:2, backgroundColor:"#ffffff", windowWidth:1024 }).then(function(canvas){
      holder.remove();
      var jsPDF = window.jspdf.jsPDF;
      var pdf = new jsPDF({ orientation:"portrait", unit:"mm", format:"a4" });
      var pageW = pdf.internal.pageSize.getWidth();
      var pageH = pdf.internal.pageSize.getHeight();
      // Márgenes laterales mínimos: la tabla llega casi al borde de la hoja,
      // como en el parte original.
      var marginX = 4, marginY = 6;
      var imgW = pageW - marginX*2;
      var imgH = imgW * canvas.height / canvas.width;
      if(imgH > pageH - marginY*2){ imgH = pageH - marginY*2; imgW = imgH * canvas.width / canvas.height; }
      var margin = marginX + (pageW - marginX*2 - imgW)/2;
      var imgData = canvas.toDataURL("image/png");
      pdf.addImage(imgData, "PNG", margin, marginY, imgW, imgH);
      var lbl = todayLabel();
      var fname = "parte-embarcaciones-" + lbl.anio + "-" + String(lbl.dia).padStart(2,"0") + "-" + lbl.mes + ".pdf";
      var asunto = "Parte de movimiento de embarcaciones – " + todayDDMMYYYY();
      var closeOv = function(){ if(overlay){ if(overlay._closePreview) overlay._closePreview(); else overlay.remove(); } };
      var file = null;
      try { file = new File([pdf.output("blob")], fname, { type:"application/pdf" }); } catch(e){ file = null; }
      var canShareFile = !!(file && navigator.share && navigator.canShare && navigator.canShare({ files:[file] }));
      if(!canShareFile){
        // Dispositivo sin menú de compartir archivos (p. ej. PC): se descarga.
        pdf.save(fname);
        if(exportBtn){ exportBtn.disabled = false; exportBtn.textContent = "Compartir"; }
        closeOv();
        return;
      }
      var doShare = function(){
        return navigator.share({ files:[file], title: asunto });
      };
      doShare().then(closeOv).catch(function(err){
        if(err && err.name === "AbortError"){
          // El usuario cerró el menú de compartir sin elegir app.
          if(exportBtn){ exportBtn.disabled = false; exportBtn.textContent = "Compartir"; }
          return;
        }
        // Si el PDF tardó en generarse, el navegador puede exigir otro toque.
        if(exportBtn){
          exportBtn.disabled = false;
          exportBtn.textContent = "Enviar PDF";
          exportBtn.onclick = function(){
            doShare().then(closeOv).catch(function(e2){
              if(e2 && e2.name === "AbortError") return;
              pdf.save(fname); closeOv();
            });
          };
        }
      });
    }).catch(function(){
      holder.remove();
      toast("Error al generar el PDF.");
      if(exportBtn){ exportBtn.disabled = false; exportBtn.textContent = "Compartir"; }
    });
  }

  // ---------------- Posiciones de desplazamiento ----------------
  // Cada zona recuerda por dónde iba su lista, y la barra de pestañas
  // recuerda por dónde se dejó. Se guarda en el dispositivo (sobrevive a
  // recargas) y se reinicia solo al importar un Excel nuevo.
  var viewSaveTimer = null;
  function saveViewNow(){
    clearTimeout(viewSaveTimer); viewSaveTimer = null;
    lsSet(LS_VIEW, { currentZone: state.currentZone, listScroll: state.listScroll, tabScroll: state.tabScroll });
  }
  function saveViewSoon(){
    if(viewSaveTimer) return;
    viewSaveTimer = setTimeout(saveViewNow, 400);
  }
  window.addEventListener("pagehide", saveViewNow);
  document.addEventListener("visibilitychange", function(){ if(document.visibilityState === "hidden") saveViewNow(); });

  function captureScroll(){
    var mainEl = root.querySelector("main");
    var mz = mainEl && mainEl.getAttribute("data-zone");
    if(mz) state.listScroll[mz] = mainEl.scrollTop;
    var tw = root.querySelector(".tabbar-wrap");
    if(tw) state.tabScroll = { x: tw.scrollLeft, y: tw.scrollTop };
  }
  function restoreScroll(){
    var tw = root.querySelector(".tabbar-wrap");
    if(tw){
      tw.scrollLeft = state.tabScroll.x || 0;
      tw.scrollTop = state.tabScroll.y || 0;
      tw.addEventListener("scroll", function(){
        state.tabScroll = { x: tw.scrollLeft, y: tw.scrollTop };
        saveViewSoon();
      }, {passive:true});
    }
    var mainEl = root.querySelector("main");
    if(mainEl){
      var zone = state.currentZone;
      mainEl.scrollTop = state.listScroll[zone] || 0;
      mainEl.addEventListener("scroll", function(){
        state.listScroll[zone] = mainEl.scrollTop;
        saveViewSoon();
      }, {passive:true});
    }
  }

  // ---------------- Reordenar pestañas (mantener pulsado y arrastrar) ----------------
  // El drag & drop nativo de HTML5 (draggable="true") no funciona con el dedo
  // en móviles (Android/iOS), solo con ratón. Se sustituye por un gesto de
  // "mantener pulsado" implementado con Pointer Events, que funciona igual
  // con ratón y con el dedo. Mientras se mantiene pulsada una pestaña más de
  // 2 s sin moverse demasiado, se activa el modo de arrastre: al mover el
  // dedo/ratón por encima de otras pestañas se van intercambiando en vivo, y
  // al soltar se guarda el nuevo orden.
  // Solo se entra en modo "mover" tras mantener pulsada la pestaña 2 s sin
  // desplazar el dedo/ratón. Cualquier desplazamiento previo (deslizar la
  // barra o la lista), soltar antes de tiempo o que el navegador cancele el
  // gesto anula el arrastre por completo.
  var TAB_HOLD_MS = 2000;
  var TAB_MOVE_TOLERANCE = 10;
  var tabDrag = null; // {el, startX, startY, timer, active, pointerId}

  function onTabPointerDown(el, ev){
    if(ev.pointerType === "mouse" && ev.button !== 0) return;
    cancelTabDrag();
    var startX = ev.clientX, startY = ev.clientY;
    var timer = setTimeout(function(){
      if(!tabDrag || tabDrag.el !== el) return;
      tabDrag.active = true;
      el.classList.add("dragging");
      if(navigator.vibrate){ try{ navigator.vibrate(40); }catch(e){} }
    }, TAB_HOLD_MS);
    tabDrag = { el: el, startX: startX, startY: startY, timer: timer, active: false, pointerId: ev.pointerId };
    // Se escucha desde el primer momento, para poder anular el gesto si el
    // usuario desplaza antes de cumplirse los 2 s.
    document.addEventListener("pointermove", onTabPointerMove);
    document.addEventListener("pointerup", onTabPointerUp);
    document.addEventListener("pointercancel", onTabPointerCancel);
  }

  function onTabPointerMove(ev){
    if(!tabDrag || ev.pointerId !== tabDrag.pointerId) return;
    if(!tabDrag.active){
      if(Math.abs(ev.clientX - tabDrag.startX) > TAB_MOVE_TOLERANCE || Math.abs(ev.clientY - tabDrag.startY) > TAB_MOVE_TOLERANCE){
        cancelTabDrag();
      }
      return;
    }
    ev.preventDefault();
    var tabbar = tabDrag.el.parentElement;
    if(!tabbar) return;
    var vertical = tabbar.classList.contains("vertical");
    var tabs = Array.prototype.slice.call(tabbar.querySelectorAll(".tab"));
    var pos = vertical ? ev.clientY : ev.clientX;
    for(var i=0;i<tabs.length;i++){
      if(tabs[i] === tabDrag.el) continue;
      var rect = tabs[i].getBoundingClientRect();
      var mid = vertical ? (rect.top + rect.height/2) : (rect.left + rect.width/2);
      if(pos < mid){
        if(tabs[i] !== tabDrag.el.nextSibling){
          tabbar.insertBefore(tabDrag.el, tabs[i]);
        }
        return;
      }
    }
    if(tabbar.lastElementChild !== tabDrag.el){
      tabbar.appendChild(tabDrag.el);
    }
  }

  function removeTabDragListeners(){
    document.removeEventListener("pointermove", onTabPointerMove);
    document.removeEventListener("pointerup", onTabPointerUp);
    document.removeEventListener("pointercancel", onTabPointerCancel);
  }

  function onTabPointerUp(ev){
    if(!tabDrag || (ev && ev.pointerId !== tabDrag.pointerId)) return;
    if(!tabDrag.active){ cancelTabDrag(); return; }
    finishTabDrag();
  }
  function onTabPointerCancel(ev){
    if(!tabDrag || (ev && ev.pointerId !== tabDrag.pointerId)) return;
    if(tabDrag.active) finishTabDrag(); else cancelTabDrag();
  }

  function finishTabDrag(){
    var tabbar = tabDrag.el.parentElement;
    clearTimeout(tabDrag.timer);
    removeTabDragListeners();
    tabDrag.el.classList.remove("dragging");
    tabDrag = null;
    // Evita que el "click" que dispara el navegador al soltar cambie de zona.
    state.tabDragSuppressUntil = Date.now() + 400;
    if(tabbar){
      var newOrder = Array.prototype.map.call(tabbar.querySelectorAll(".tab"), function(el){ return el.getAttribute("data-zone"); });
      if(newOrder.join("|") !== state.zoneOrder.join("|")){
        state.zoneOrder = newOrder;
        saveZoneOrder();
      }
    }
    render();
  }

  function cancelTabDrag(){
    if(!tabDrag) return;
    clearTimeout(tabDrag.timer);
    if(tabDrag.active && tabDrag.el) tabDrag.el.classList.remove("dragging");
    removeTabDragListeners();
    tabDrag = null;
  }

  // En pantallas táctiles, mientras se arrastra una pestaña se bloquea el
  // desplazamiento de la página para que el navegador no se lleve el gesto.
  document.addEventListener("touchmove", function(ev){
    if(tabDrag && tabDrag.active && ev.cancelable) ev.preventDefault();
  }, {passive:false});
  // Evita el menú contextual (mantener pulsado) sobre las pestañas.
  document.addEventListener("contextmenu", function(ev){
    if(ev.target && ev.target.closest && ev.target.closest(".tab")) ev.preventDefault();
  });

  var root = document.getElementById("app");

  function render(){
    if(!state.ready){
      root.innerHTML = '<div class="upload-screen"><div class="upload-box"><p>Cargando…</p></div></div>';

    }
    if(!state.boats.length){

    var boatsInZone = state.boats.filter(function(b){ return b.zona === state.currentZone; })

    if(sortDesc) boatsInZone.reverse();
    var checkedCount = boatsInZone.filter(function(b){ return state.day.salidas[b.id] && state.day.salidas[b.id].checked; }).length;
    var entradasZona = state.day.entradas.filter(function(e){ return e.zona === state.currentZone; });

    captureScroll();
    var html = "";
    html += renderHeader();
    if(state.tabsVertical){ html += '<div class="body-row">'; }

    html += '<div class="zone-tools">';

    html += '    <button class="sort-btn'+(sortDesc?" desc":"")+'" data-action="togglesort" title="'+(sortDesc?"Orden descendente (pulsa para ascendente)":"Orden ascendente (pulsa para descendente)")+'" aria-label="Cambiar orden">🔃</button>';
    html += '</div>';
    html += '<div class="zone-header">';
    html += '  <div class="zone-title">Zona '+escapeHtml(state.currentZone)+'</div>';
    html += '  <div class="zone-side">';
    html += '    <div class="zone-progress">'+checkedCount+' / '+boatsInZone.length+' con salida marcada</div>';
    html += '  </div>';
    html += '</div>';

    if(!boatsInZone.length){
      html += '<div class="empty-state">No hay embarcaciones registradas en esta zona.</div>';
    } else {
      html += '<div class="boat-list">';
      boatsInZone.forEach(function(b){
        var salida = state.day.salidas[b.id];
        var isChecked = !!(salida && salida.checked);
        var isVisto = !!state.day.vistos[b.id];
        var obsOpen = !!state.obsOpen[b.id];
        var cardClass = (isVisto?"visto ":"")+(isChecked?"checked":"");
        html += '<div class="boat-card '+cardClass+'">';
        var tick = '<svg viewBox="0 0 24 24" fill="none"><path d="M4 12l5 5L20 6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        var salidaHtml = '<div class="mark mark-salida" data-boat="'+b.id+'" data-action="toggle" title="Marcar salida"><div class="mark-box '+(isChecked?"on":"")+'">'+tick+'</div><span class="mark-label">Salida</span></div>';

        var vistoLabel = '<span class="mark-label">Visto</span>';
        // Por defecto: Salida a la izquierda y Visto (con etiqueta) a la derecha.
        var vistoRight = '<div class="mark mark-visto" data-boat="'+b.id+'" data-action="togglevisto" title="Marcar como visto">'+vistoBox+vistoLabel+'</div>';
        var vistoLeft = '<div class="mark mark-visto" data-boat="'+b.id+'" data-action="togglevisto" title="Marcar como visto">'+vistoBox+vistoLabel+'</div>';
        html += '  ' + (state.checksSwapped ? vistoLeft : salidaHtml);
        html += '  <div class="boat-info">';
        html += '    <div class="boat-name">'+escapeHtml(b.nombre)+(b.matricula? ' <span class="matricula">'+escapeHtml(b.matricula)+'</span>':'')+'</div>';
        html += '    <div class="boat-meta"><span class="amarre">'+escapeHtml(b.amarre)+'</span>'+escapeHtml(b.descripcion)+'</div>';
        html += '    <button class="obs-toggle" data-action="toggleobs" data-boat="'+b.id+'">'+(obsOpen? "ocultar observación":"añadir observación")+'</button>';
        if(obsOpen){
          var sx = salida || {};
          html += '    <div class="obs-fields">';
          html += '      <label class="obs-lbl" for="elec_'+b.id+'">Consumo de electricidad</label><input class="obs-input" id="elec_'+b.id+'" data-action="obsinput" data-field="elec" data-boat="'+b.id+'" inputmode="decimal" placeholder="Electricidad" value="'+escapeHtml(sx.elec||"")+'">';
          html += '      <label class="obs-lbl" for="agua_'+b.id+'">Consumo de agua</label><input class="obs-input" id="agua_'+b.id+'" data-action="obsinput" data-field="agua" data-boat="'+b.id+'" inputmode="decimal" placeholder="Agua" value="'+escapeHtml(sx.agua||"")+'">';

          html += '    </div>';
        } else if(obsSalida(salida)){
          html += '    <div class="obs-summary">'+escapeHtml(obsSalida(salida))+'</div>';
        }
        html += '  </div>';
        html += '  ' + (state.checksSwapped ? salidaHtml : vistoRight);
        html += '</div>';
      });
      html += '</div>';
    }

    if(entradasZona.length){
      html += '<div class="extra-list">';
      html += '  <div class="extra-title">Entradas añadidas en esta zona</div>';
      html += '  <div class="boat-list">';
      entradasZona.forEach(function(e){
        html += '<div class="boat-card entrada">';
        html += '  <div class="boat-info">';
        html += '    <div class="boat-name">'+escapeHtml(e.embarcacion)+(e.matricula? ' <span class="matricula">'+escapeHtml(e.matricula)+'</span>':'')+'</div>';
        html += '    <div class="boat-meta"><span class="amarre">'+escapeHtml(e.atraque)+'</span>'+(obsEntrada(e)? escapeHtml(obsEntrada(e)):'')+'</div>';
        html += '  </div>';
        html += '  <button class="remove-btn" data-action="removeentrada" data-id="'+e.id+'">×</button>';
        html += '</div>';
      });
      html += '  </div>';
      html += '</div>';
    }

    html += '</main>';
    if(state.tabsVertical){ html += '</div>'; }

    root.innerHTML = html;
    restoreScroll();
    saveViewSoon();
    bindEvents();

    if(modalState){
      renderModal();
    }
  }

  function renderTabs(){
    var vClass = state.tabsVertical ? " vertical" : "";
    var h = '<div class="tabbar-wrap'+vClass+'"><div class="tabbar'+vClass+'">';
    state.zoneOrder.forEach(function(z){
      var count = state.boats.filter(function(b){ return b.zona===z; }).length;
      var active = z===state.currentZone;
      h += '<button class="tab '+(active?"active":"")+'" data-zone="'+z+'" data-action="tab">'+
           escapeHtml(z)+'<span class="count">'+count+'</span></button>';
    });
    h += '</div></div>';
    return h;
  }

  function renderModal(){
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    var prefix = zonePrefix(modalState.zona);
    var atraqueFieldHtml = prefix
      ? '<div class="field"><label>Atraque</label><div class="atraque-input"><span class="atraque-prefix">'+escapeHtml(prefix)+'</span><input id="m_atraque_num" inputmode="numeric" placeholder="Número"></div></div>'
      : '<div class="field"><label>Atraque</label><input id="m_atraque_free" placeholder="Código de amarre"></div>';
    overlay.innerHTML =
      '<div class="modal">'+
        '<h3>Añadir entrada — Zona '+escapeHtml(modalState.zona)+'</h3>'+
        '<div class="field"><label>Embarcación</label><input id="m_embarcacion" placeholder="Nombre (si se conoce)"></div>'+
        '<div class="field"><label>Matrícula</label><input id="m_matricula" placeholder="Matrícula (si se conoce)"></div>'+
        atraqueFieldHtml+
        '<div class="field"><label for="m_observaciones">Observaciones</label><textarea id="m_observaciones" rows="4" placeholder="Cualquier información necesaria"></textarea></div>'+
        '<div class="modal-actions">'+
          '<button class="btn btn-outline" id="m_cancel">Cancelar</button>'+
          '<button class="btn btn-sea" id="m_save">Guardar</button>'+
        '</div>'+
      '</div>';
    document.body.appendChild(overlay);
    document.getElementById("m_cancel").onclick = function(){ overlay.remove(); closeModal(); };
    document.getElementById("m_save").onclick = function(){
      var embarcacion = document.getElementById("m_embarcacion").value.trim();
      var matricula = document.getElementById("m_matricula").value.trim();
      var atraque;
      if(prefix){
        var num = document.getElementById("m_atraque_num").value.trim();
        if(prefix === "A" && /^\d{1,2}$/.test(num)) num = num.padStart(3, "0"); // A5 → A005, A45 → A045
        atraque = num ? (prefix + num) : prefix;
      } else {
        atraque = document.getElementById("m_atraque_free").value.trim();
        var mA = /^A(\d{1,2})$/i.exec(atraque);
        if(mA) atraque = "A" + mA[1].padStart(3, "0");
      }
      var observaciones = document.getElementById("m_observaciones").value.trim();
      var zona = modalState.zona;
      // Cerramos el modal ANTES de llamar a addEntrada: addEntrada dispara
      // render() internamente, y si modalState siguiera activo en ese
      // momento se volvería a crear un modal nuevo por encima del actual
      // (el original ya no se ve, aunque los datos sí se guardan) — parece
      // que "Guardar" no hace nada.
      overlay.remove();
      modalState = null;
      addEntrada(zona, {
        embarcacion: embarcacion,
        matricula: matricula,
        atraque: atraque,
        observaciones: observaciones
      });
    };
  }

  function renderUploadScreen(){
    root.innerHTML =

        '<h2>Sube el listado de embarcaciones</h2>'+
        '<p>Sube el Excel que os facilita administración. La app creará automáticamente una pestaña por cada zona (columna de código de amarre).</p>'+
        '<label class="btn btn-sea">Seleccionar archivo Excel<input type="file" id="fileInputInitial" accept=".xlsx,.xls"></label>'+
      '</div></div>';
    document.getElementById("fileInputInitial").addEventListener("change", function(e){
      handleFile(e.target.files[0]);
    });
  }

  function bindEvents(){
    var fi = document.getElementById("fileInput");
    if(fi) fi.addEventListener("change", function(e){ handleFile(e.target.files[0]); });

    root.querySelectorAll('[data-action="tab"]').forEach(function(el){
      el.addEventListener("click", function(){
        // Tras un arrastre para reordenar, el navegador dispara igualmente
        // un "click" al soltar; se ignora esa vez para no cambiar de zona.
        if(Date.now() < state.tabDragSuppressUntil){ return; }
        captureScroll();
        state.currentZone = el.getAttribute("data-zone");
        render();
      });
      el.addEventListener("pointerdown", function(ev){ onTabPointerDown(el, ev); });
    });

    root.querySelectorAll('[data-action="toggle"]').forEach(function(el){
      el.addEventListener("click", function(){ toggleSalida(el.getAttribute("data-boat")); });
    });
    root.querySelectorAll('[data-action="togglevisto"]').forEach(function(el){
      el.addEventListener("click", function(){ toggleVisto(el.getAttribute("data-boat")); });
    });
    root.querySelectorAll('[data-action="toggleobs"]').forEach(function(el){
      el.addEventListener("click", function(){
        var id = el.getAttribute("data-boat");
        state.obsOpen[id] = !state.obsOpen[id];
        render();
      });
    });
    root.querySelectorAll('[data-action="obsinput"]').forEach(function(el){
      el.addEventListener("change", function(){
        setObs(el.getAttribute("data-boat"), el.value.trim(), el.getAttribute("data-field"));
        // Al anotar consumos u observaciones la embarcación queda como salida:
        // se refleja en la tarjeta sin redibujar (para no perder el foco).
        var card = el.closest(".boat-card");
        if(card){
          card.classList.add("checked");
          var box = card.querySelector(".mark-salida .mark-box");
          if(box) box.classList.add("on");
        }
      });
    });
    root.querySelectorAll('[data-action="removeentrada"]').forEach(function(el){
      el.addEventListener("click", function(){ removeEntrada(el.getAttribute("data-id")); });
    });
    var openBtn = root.querySelector('[data-action="openentrada"]');
    if(openBtn) openBtn.addEventListener("click", function(){ openEntradaModal(state.currentZone); });

    var printBtn = root.querySelector('[data-action="print"]');
    if(printBtn) printBtn.addEventListener("click", doPrint);

    var sortBtn = root.querySelector('[data-action="togglesort"]');
    if(sortBtn) sortBtn.addEventListener("click", function(){
      var z = state.currentZone;
      if(state.sortDesc[z]) delete state.sortDesc[z]; else state.sortDesc[z] = true;
      lsSet(LS_SORT, state.sortDesc);
      state.listScroll[z] = 0; // al invertir el orden se empieza desde arriba
      var m = root.querySelector("main"); if(m) m.scrollTop = 0;
      render();
    });

    var swapBtn = root.querySelector('[data-action="swapchecks"]');
    if(swapBtn) swapBtn.addEventListener("click", function(){
      state.checksSwapped = !state.checksSwapped;
      lsSet(LS_CHECKS_SWAP, {on: state.checksSwapped});
      render();
    });

    var toggleTabsBtn = root.querySelector('[data-action="toggletabs"]');
    if(toggleTabsBtn) toggleTabsBtn.addEventListener("click", toggleTabsOrientation);
  }

  loadAll();
})();
</script>
<script>
if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
